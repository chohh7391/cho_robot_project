# Hardware-owned SAFE hold tuple. kp/kd are the per-joint profile values.
# tau_ff is the joint torque measured in the same read as the position,
# clamped per joint to tau_ff_magnitude. The MIT equation runs inside the
# motor without a gravity model, so the hold needs the gravity torque in
# tau_ff; at rest the measured torque is that torque, while the last accepted
# tau_ff is only the part the producer did not put in its kp spring (keeping
# it alone let the spring's share sag away at the safe gains). The real
# adapter (ArmConsumer) measures it on the drives; the MuJoCo limiter takes
# the torque it applied in the previous cycle, the simulator's measured joint
# torque, and applies it in the latching cycle. A new session's first hold
# is seeded with the torque measured at the seed read: about zero on motors
# enabled just now, the gravity torque on an arm that was being held.
#
# A latch in motion is the exception: there the measured torque also carries
# the motion's inertial and contact torque, and a hold built on it would pull
# the arm toward the pose it happened to be passing. When any joint's measured
# |dq| in the latch's read is at least the profile's safe_hold_motion_velocity,
# each joint with a hold_torque (hold_interface above) takes the measured torque
# bounded to hold_torque +/- safe_hold_torque_band, then the usual clamp. On the
# real profiles the band is the joint's identified static friction, so a
# hold_torque error inside it leaves the arm still while it stays below the
# breakaway friction (the latch finds the arm moving). A joint without a finite
# hold_torque, and every latch at rest, keep the measured torque: at rest it is
# what supports a payload the producer's model does not know.
safe_seed:
  q_des: measured_position
  dq_des: 0.0
  kp: safe_hold_stiffness
  kd: safe_hold_damping
  tau_ff: measured_torque
  tau_ff_bound: hold_torque_plus_minus_safe_hold_torque_band
  tau_ff_bound_when: any_joint_measured_abs_velocity_at_least_safe_hold_motion_velocity
  tau_ff_bound_needs: finite_hold_torque_of_the_last_accepted_commit_of_the_session
