gripper_contract: separate_position_control
# Hardware-owned SAFE hold tuple. kp/kd are the per-joint profile values.
# tau_ff keeps the last accepted feed-forward because the MIT equation runs
# inside the motor without a gravity model: zeroing it would drop the arm's
# gravity compensation exactly when the controller stops commanding it. A new
# session (no accepted command yet) therefore holds with tau_ff = 0.
safe_seed:
  q_des: measured_position
  dq_des: 0.0
  kp: safe_hold_stiffness
  kd: safe_hold_damping
  tau_ff: last_accepted_tau_ff
