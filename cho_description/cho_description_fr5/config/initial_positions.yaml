# FR5 initial (spawn) pose, in radians. All zeros per project convention.
# NOTE: [0,0,0,0,0,0] is a wrist singularity (j5 = 0 aligns the j4/j6 axes), so
# task-space (reach) control directly from the spawn pose is poorly conditioned.
# Move to a non-singular pose first (action_client `home 1`) before task control.
j1: 0.0
j2: 0.0
j3: 0.0
j4: 0.0
j5: 0.0
j6: 0.0
