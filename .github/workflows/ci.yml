name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Container jobs default to `sh`, where `set -o pipefail` is not a valid option
# and aborts the step with exit 2. Pin bash for every run step.
defaults:
  run:
    shell: bash

# Only the packages that build from binary (apt) dependencies alone are covered.
# cho_controller_franka, bota_ft_sensor and every cho_bringup_* package need the
# extern/ submodules (franka_ros2 + libfranka, mujoco_ros2_control,
# Universal_Robots_ROS2_Driver, bota_driver_ros2) built from source; there are no
# Humble debs for franka_msgs / franka_gripper / franka_hardware. Adding them
# means a source build of libfranka in CI - deferred, tracked separately.
env:
  BUILD_PACKAGES: >-
    cho_interfaces
    cho_trajectory_smoother
    cho_controller_common
    cho_controller_ur
    cho_controller_openarm
    cho_description_franka
    cho_description_fr5
    cho_description_ur
    cho_description_openarm
    cho_robot_config
    cho_control_tools
    cho_task_manager
  # cho_description_franka / cho_description_fr5 / cho_description_ur are forks
  # of upstream descriptions and carry their upstream lint debt, so they are
  # built (the xacro/URDF must still parse) but not linted.
  # cho_description_openarm is also a fork but its tests are ours, so it is
  # tested too - they catch a xacro branch that has stopped parsing for one
  # environment.
  TEST_PACKAGES: >-
    cho_interfaces
    cho_trajectory_smoother
    cho_controller_common
    cho_controller_ur
    cho_controller_openarm
    cho_description_openarm
    cho_robot_config
    cho_control_tools
    cho_task_manager

jobs:
  build-and-test:
    name: Humble build + test
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/cho_robot_project

      # cho_controller_common compiles src/solver/solver_HQP_qpoases.cpp, which
      # does `#include <qpOASES.hpp>`. qpOASES is not a rosdep key and is not
      # declared in that package's CMakeLists or package.xml - it is the
      # extern/qpOASES submodule, installed to /usr/local on developer
      # machines. Reproduce that here, or the build fails on a missing header.
      - name: Build and install qpOASES
        shell: bash
        run: |
          set -eo pipefail
          cd src/cho_robot_project
          git config --global --add safe.directory "$(pwd)"
          git submodule update --init --depth 1 extern/qpOASES
          cmake -S extern/qpOASES -B /tmp/qpoases-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/qpoases-build -j"$(nproc)"
          cmake --install /tmp/qpoases-build

      - name: Install ROS dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          rosdep update --rosdistro humble
          source /opt/ros/humble/setup.bash
          rosdep install -y --rosdistro humble --ignore-src --from-paths \
            src/cho_robot_project/cho_interfaces \
            src/cho_robot_project/cho_controller/utils/cho_trajectory_smoother \
            src/cho_robot_project/cho_controller/cho_controller_common \
            src/cho_robot_project/cho_controller/cho_controller_ur \
            src/cho_robot_project/cho_controller/cho_controller_openarm \
            src/cho_robot_project/cho_description/cho_description_franka \
            src/cho_robot_project/cho_description/cho_description_fr5 \
            src/cho_robot_project/cho_description/cho_description_ur \
            src/cho_robot_project/cho_description/cho_description_openarm \
            src/cho_robot_project/cho_robot_config \
            src/cho_robot_project/cho_control_tools \
            src/cho_robot_project/cho_task_manager

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --packages-select ${{ env.BUILD_PACKAGES }}

      - name: Test
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select ${{ env.TEST_PACKAGES }} \
            --return-code-on-test-failure

      - name: Test results
        if: always()
        shell: bash
        run: colcon test-result --verbose

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
