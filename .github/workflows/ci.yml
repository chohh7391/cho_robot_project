name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Container jobs default to `sh`, where `set -o pipefail` is not a valid option
# and aborts the step with exit 2. Pin bash for every run step.
defaults:
  run:
    shell: bash

# Only the packages that build from binary (apt) dependencies alone are covered.
# hansung_scale_msgs / hansung_scale_driver qualify: rosidl, rclpy and
# python3-serial are all rosdep keys, so the scale stack builds and tests here.
# cho_controller_franka, bota_ft_sensor and the OpenArm hardware packages are not
# built: they need extern/ sources built from source (franka_ros2 + libfranka,
# bota_driver_ros2, openarm_can + mujoco_ros2_control). franka_gripper,
# franka_hardware, franka_ign_ros2_control and franka_robot_state_broadcaster
# have rosdep rules, but the Humble debs they name are not published (only
# franka_msgs and franka_description are). Adding them means a source build of
# libfranka in CI - deferred, tracked separately.
#
# Every workspace package a listed package depends on (any dependency type) must
# be listed too, or named in ROSDEP_SKIP_KEYS: `rosdep install --ignore-src`
# treats only the packages under --from-paths as source and fails on any other
# workspace name as an unknown key. That is why cho_moveit_fr5 is here
# (cho_task_manager exec_depends on it).
#
# All four bringups and their MoveIt packages are here for cho_bringup_common's
# launch golden test (test/test_launch_golden.py), which evaluates every launch
# file and follows its cho_moveit_* includes; nothing is started, so the
# bringups' exec_depends on the packages above are skipped (ROSDEP_SKIP_KEYS)
# rather than built, and the two Franka packages the launch files look up by
# path are registered as empty stand-ins (tools/ci/stub_ament_packages.sh).
env:
  BUILD_PACKAGES: >-
    cho_interfaces
    cho_controller_common
    cho_controller_base
    cho_vla_core
    cho_controller_gripper
    cho_controller_ur
    cho_controller_fr5
    cho_openarm_mit_core
    cho_hardware_openarm_mit_test
    cho_controller_openarm_mit
    cho_description_franka
    cho_description_fr5
    cho_description_ur
    cho_description_openarm
    cho_robot_config
    cho_bringup_common
    cho_bringup_ur
    cho_bringup_fr5
    cho_bringup_franka
    cho_bringup_openarm
    cho_simulation_isaac
    cho_moveit_common
    cho_moveit_ur
    cho_moveit_fr5
    cho_moveit_franka
    cho_moveit_openarm
    cho_control_tools
    cho_task_manager
    cho_object_pose
    cho_realsense
    cho_oak
    hansung_scale_msgs
    hansung_scale_driver
  # Dependencies of BUILD_PACKAGES that are not installed here; see above.
  # Workspace packages left out of BUILD_PACKAGES, then Franka keys whose debs
  # do not exist.
  ROSDEP_SKIP_KEYS: >-
    cho_controller_franka
    cho_hardware_openarm_mit_mujoco
    cho_hardware_openarm_mit_real
    franka_gripper
    franka_hardware
    franka_ign_ros2_control
    franka_robot_state_broadcaster
  # Looked up by path by the Franka bringups (franka_ign_ros2_control's lib/ for
  # the Gazebo plugin path, franka_gripper's gripper.launch.py); stand-ins let
  # the golden test evaluate them. Never started.
  STUB_PACKAGES: >-
    franka_gripper
    franka_ign_ros2_control
  # Built but not tested here: cho_controller_fr5 (its tests are the pour
  # cell's). The cho_description_* forks other than franka and openarm, and the
  # MoveIt configuration packages, have no tests of their own; their launch
  # files are covered by the golden test.
  TEST_PACKAGES: >-
    cho_interfaces
    cho_controller_common
    cho_controller_base
    cho_vla_core
    cho_controller_gripper
    cho_controller_ur
    cho_openarm_mit_core
    cho_hardware_openarm_mit_test
    cho_controller_openarm_mit
    cho_description_franka
    cho_description_openarm
    cho_robot_config
    cho_bringup_common
    cho_bringup_ur
    cho_bringup_fr5
    cho_bringup_franka
    cho_bringup_openarm
    cho_simulation_isaac
    cho_moveit_common
    cho_control_tools
    cho_task_manager
    cho_object_pose
    cho_realsense
    cho_oak
    hansung_scale_msgs
    hansung_scale_driver

jobs:
  build-and-test:
    name: Humble build + test
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/cho_robot_project

      # cho_description_openarm's MIT contract tests read their pinned DM motor
      # header from extern/openarm_can, a source-only dependency: initialize it
      # before building or testing.
      - name: Initialize extern/openarm_can
        shell: bash
        run: |
          set -eo pipefail
          cd src/cho_robot_project
          git config --global --add safe.directory "$(pwd)"
          git submodule update --init --depth 1 extern/openarm_can

      - name: Install ROS dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          rosdep update --rosdistro humble
          source /opt/ros/humble/setup.bash
          # The paths come from BUILD_PACKAGES, so the two lists cannot drift: a
          # hand-kept copy here still named cho_controller_openarm after that
          # package was merged away, and rosdep failed every run on it.
          rosdep install -y --rosdistro humble --ignore-src --from-paths \
            $(colcon list --paths-only --packages-select ${{ env.BUILD_PACKAGES }}) \
            --skip-keys "${{ env.ROSDEP_SKIP_KEYS }}"
          # The flake8 plugins a ROS 2 development machine has (the Humble
          # source-install instructions list them). Each package pins which of
          # their rules it follows, so the lint tests below give the verdict
          # they give locally; without the plugins here, a package that had not
          # pinned them would pass in CI and fail on every developer's machine.
          apt-get install -y --no-install-recommends \
            python3-flake8-blind-except python3-flake8-builtins \
            python3-flake8-class-newline python3-flake8-comprehensions \
            python3-flake8-deprecated python3-flake8-docstrings \
            python3-flake8-import-order python3-flake8-quotes

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --packages-select ${{ env.BUILD_PACKAGES }}

      - name: Test
        shell: bash
        # The bringups the launch golden test must find here (a missing one
        # fails rather than skips); see BUILD_PACKAGES.
        env:
          CHO_LAUNCH_GOLDEN_REQUIRE: cho_bringup_ur cho_bringup_fr5 cho_bringup_franka cho_bringup_openarm
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          stubs=$(src/cho_robot_project/tools/ci/stub_ament_packages.sh \
            "${RUNNER_TEMP:-/tmp}/stub_packages" ${{ env.STUB_PACKAGES }})
          export AMENT_PREFIX_PATH="${stubs}:${AMENT_PREFIX_PATH}"
          colcon test \
            --packages-select ${{ env.TEST_PACKAGES }} \
            --return-code-on-test-failure

      - name: Test results
        if: always()
        shell: bash
        run: colcon test-result --verbose

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
