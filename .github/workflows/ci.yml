name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Container jobs default to `sh`, where `set -o pipefail` is not a valid option
# and aborts the step with exit 2. Pin bash for every run step.
defaults:
  run:
    shell: bash

# Package selection is opt-out. The build set is every package colcon finds in
# this checkout except NOT_BUILT_PACKAGES ("Select packages" below), and rosdep,
# Build and Test all take that one set, so a new package is built and tested
# without being named here. Of the submodules only extern/openarm_can is checked
# out; the packages in the others are not in this checkout at all.
#
# A package in the checkout that is not built goes in NOT_BUILT_PACKAGES AND in
# ROSDEP_SKIP_KEYS, because they answer two different checks: colcon refuses a
# workspace dependency that is neither selected nor installed (Build and Test
# pass NOT_BUILT_PACKAGES as --packages-ignore), and `rosdep install
# --ignore-src` reports any workspace name outside --from-paths as an unknown
# key. A key that is not in the checkout at all (a Franka deb that was never
# published) goes in ROSDEP_SKIP_KEYS alone.
#
# Check a change in a checkout like this one (a clone with only
# extern/openarm_can initialized, at <ws>/src/cho_robot_project), from <ws>, in
# a shell that has sourced only /opt/ros/humble:
#   rosdep install --simulate --rosdistro humble --ignore-src --from-paths \
#     $(colcon list --paths-only --base-paths src --packages-ignore <NOT_BUILT_PACKAGES>) \
#     --skip-keys "<ROSDEP_SKIP_KEYS>"
# In a full workspace the other submodules' packages count as source and hide
# keys CI has to install. Neither that check nor a local build catches a missing
# NOT_BUILT_PACKAGES entry; the Build step here does.
#
# All four bringups are built for cho_bringup_common's launch golden test
# (test/test_launch_golden.py), which evaluates every launch file and starts
# nothing; the two Franka packages the launch files look up by path are
# registered as empty stand-ins (tools/ci/stub_ament_packages.sh).
env:
  # In the checkout but neither built nor tested, and why:
  # - cho_hardware_openarm_mit_mujoco: built on the extern/mujoco_ros2_control
  #   pin, not checked out here; the Humble deb is another upstream version.
  # - fairino_hardware_v3_8_0, fairino_msgs: vendored sources in extern/, which
  #   are not edited, and their ament_lint tests fail on them.
  NOT_BUILT_PACKAGES: >-
    cho_hardware_openarm_mit_mujoco
    fairino_hardware_v3_8_0
    fairino_msgs
  # The NOT_BUILT_PACKAGES names, then the Franka keys the Franka bringup
  # exec_depends on whose Humble debs are not published (franka_msgs and
  # franka_description are, and rosdep installs them).
  ROSDEP_SKIP_KEYS: >-
    cho_hardware_openarm_mit_mujoco
    fairino_hardware_v3_8_0
    fairino_msgs
    franka_gripper
    franka_hardware
    franka_ign_ros2_control
    franka_robot_state_broadcaster
  # Looked up by path by the Franka bringups (franka_ign_ros2_control's lib/ for
  # the Gazebo plugin path, franka_gripper's gripper.launch.py); stand-ins let
  # the golden test evaluate them. Never started.
  STUB_PACKAGES: >-
    franka_gripper
    franka_ign_ros2_control

jobs:
  build-and-test:
    name: Humble build + test
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/cho_robot_project

      # The one submodule checked out. cho_description_openarm's MIT contract
      # tests read their pinned DM motor header from it, and openarm_can is a
      # package of the build set (cho_hardware_openarm_mit_real links it), so
      # it is initialized before the packages are selected.
      - name: Initialize extern/openarm_can
        shell: bash
        run: |
          set -eo pipefail
          cd src/cho_robot_project
          git config --global --add safe.directory "$(pwd)"
          git submodule update --init --depth 1 extern/openarm_can

      # The build set (see the header), as BUILD_SET for the steps below.
      - name: Select packages
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          packages=$(colcon list --names-only --base-paths src \
            --packages-ignore ${{ env.NOT_BUILT_PACKAGES }})
          echo "$packages"
          echo "BUILD_SET=$(paste -sd ' ' <<< "$packages")" >> "$GITHUB_ENV"

      - name: Install ROS dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          rosdep update --rosdistro humble
          source /opt/ros/humble/setup.bash
          rosdep install -y --rosdistro humble --ignore-src --from-paths \
            $(colcon list --paths-only --packages-select ${{ env.BUILD_SET }}) \
            --skip-keys "${{ env.ROSDEP_SKIP_KEYS }}"
          # The flake8 plugins a ROS 2 development machine has (the Humble
          # source-install instructions list them). Each package pins which of
          # their rules it follows, so the lint tests below give the verdict
          # they give locally; without the plugins here, a package that had not
          # pinned them would pass in CI and fail on every developer's machine.
          apt-get install -y --no-install-recommends \
            python3-flake8-blind-except python3-flake8-builtins \
            python3-flake8-class-newline python3-flake8-comprehensions \
            python3-flake8-deprecated python3-flake8-docstrings \
            python3-flake8-import-order python3-flake8-quotes

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          # Two workers: cho_controller_franka, _openarm_mit, _ur and _fr5 each
          # run make at the runner's job count, and one Franka file peaks near 2 GB.
          #
          # REQUIRE_VENDOR: without OpenArmCAN, cho_hardware_openarm_mit_real
          # configures with a warning and builds no plugin, and its gtests
          # vanish with it. Here that is a configure failure. Every package gets
          # the flag; only that one reads it.
          colcon build --symlink-install --parallel-workers 2 \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
              -DCHO_OPENARM_MIT_REAL_REQUIRE_VENDOR=ON \
            --packages-select ${{ env.BUILD_SET }} \
            --packages-ignore ${{ env.NOT_BUILT_PACKAGES }}

      - name: Test
        shell: bash
        # The bringups the launch golden test must find here (a missing one
        # fails rather than skips); all four are in the build set.
        env:
          CHO_LAUNCH_GOLDEN_REQUIRE: cho_bringup_ur cho_bringup_fr5 cho_bringup_franka cho_bringup_openarm
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          stubs=$(src/cho_robot_project/tools/ci/stub_ament_packages.sh \
            "${RUNNER_TEMP:-/tmp}/stub_packages" ${{ env.STUB_PACKAGES }})
          export AMENT_PREFIX_PATH="${stubs}:${AMENT_PREFIX_PATH}"
          colcon test \
            --packages-select ${{ env.BUILD_SET }} \
            --packages-ignore ${{ env.NOT_BUILT_PACKAGES }} \
            --return-code-on-test-failure

      # A run that tested nothing must not look like a pass: the Test step is
      # skipped when Build fails, and a build that selects no tests reports
      # "Summary: 0 tests". Either is an outage of the whole suite.
      - name: Test results
        if: always()
        shell: bash
        run: |
          set -o pipefail
          colcon test-result --verbose | tee "${RUNNER_TEMP:-/tmp}/test_result.txt"
          summary=$(tail -n 1 "${RUNNER_TEMP:-/tmp}/test_result.txt")
          case "$summary" in
            "Summary: 0 tests"*) echo "::error::no test ran"; exit 1 ;;
          esac

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
