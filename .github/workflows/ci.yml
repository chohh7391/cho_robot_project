name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Container jobs default to `sh`, where `set -o pipefail` is not a valid option
# and aborts the step with exit 2. Pin bash for every run step.
defaults:
  run:
    shell: bash

# Only the packages that build from binary (apt) dependencies alone are covered.
# hansung_scale_msgs / hansung_scale_driver qualify: rosidl, rclpy and
# python3-serial are all rosdep keys, so the scale stack builds and tests here.
# cho_controller_franka, bota_ft_sensor and every cho_bringup_<robot> package need the
# extern/ submodules (franka_ros2 + libfranka, mujoco_ros2_control,
# Universal_Robots_ROS2_Driver, bota_driver_ros2) built from source; there are no
# Humble debs for franka_msgs / franka_gripper / franka_hardware. Adding them
# means a source build of libfranka in CI - deferred, tracked separately.
env:
  BUILD_PACKAGES: >-
    cho_interfaces
    cho_controller_common
    cho_controller_base
    cho_vla_core
    cho_controller_gripper
    cho_controller_ur
    cho_openarm_mit_core
    cho_hardware_openarm_mit_test
    cho_controller_openarm_mit
    cho_description_franka
    cho_description_fr5
    cho_description_ur
    cho_description_openarm
    cho_robot_config
    cho_bringup_common
    cho_moveit_common
    cho_control_tools
    cho_task_manager
    cho_object_pose
    cho_realsense
    cho_oak
    hansung_scale_msgs
    hansung_scale_driver
  # cho_description_franka / cho_description_fr5 / cho_description_ur are forks
  # of upstream descriptions and carry their upstream lint debt, so they are
  # built (the xacro/URDF must still parse) but not linted.
  # cho_description_openarm is also a fork but its tests are ours, so it is
  # tested too - they catch a xacro branch that has stopped parsing for one
  # environment.
  TEST_PACKAGES: >-
    cho_interfaces
    cho_controller_common
    cho_controller_base
    cho_vla_core
    cho_controller_gripper
    cho_controller_ur
    cho_openarm_mit_core
    cho_hardware_openarm_mit_test
    cho_controller_openarm_mit
    cho_description_openarm
    cho_robot_config
    cho_bringup_common
    cho_moveit_common
    cho_control_tools
    cho_task_manager
    cho_object_pose
    cho_realsense
    cho_oak
    hansung_scale_msgs
    hansung_scale_driver

jobs:
  build-and-test:
    name: Humble build + test
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/cho_robot_project

      # cho_description_openarm's MIT contract tests read their pinned DM motor
      # header from extern/openarm_can, a source-only dependency: initialize it
      # before building or testing.
      - name: Initialize extern/openarm_can
        shell: bash
        run: |
          set -eo pipefail
          cd src/cho_robot_project
          git config --global --add safe.directory "$(pwd)"
          git submodule update --init --depth 1 extern/openarm_can

      - name: Install ROS dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          rosdep update --rosdistro humble
          source /opt/ros/humble/setup.bash
          # The paths come from BUILD_PACKAGES, so the two lists cannot drift: a
          # hand-kept copy here still named cho_controller_openarm after that
          # package was merged away, and rosdep failed every run on it.
          rosdep install -y --rosdistro humble --ignore-src --from-paths \
            $(colcon list --paths-only --packages-select ${{ env.BUILD_PACKAGES }})

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --packages-select ${{ env.BUILD_PACKAGES }}

      - name: Test
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select ${{ env.TEST_PACKAGES }} \
            --return-code-on-test-failure

      - name: Test results
        if: always()
        shell: bash
        run: colcon test-result --verbose

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
