name: Lint

# Fast feedback that needs no colcon build. The heavier build + test matrix
# lives in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Container jobs default to `sh`, where `set -o pipefail` is not a valid option
# and aborts the step with exit 2. Pin bash for every run step.
defaults:
  run:
    shell: bash

jobs:
  ament_lint:
    name: ament linters
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          set -eo pipefail
          apt-get update
          # The flake8 plugins come with them: a ROS 2 development machine has
          # them (the Humble source-install instructions list them), and each
          # package pins which of their rules it follows, so this step and a
          # local `colcon test` give the same verdict.
          apt-get install -y --no-install-recommends \
            python3-pytest \
            ros-humble-ament-flake8 \
            ros-humble-ament-pep257 \
            ros-humble-ament-copyright \
            ros-humble-ament-xmllint \
            python3-flake8-blind-except python3-flake8-builtins \
            python3-flake8-class-newline python3-flake8-comprehensions \
            python3-flake8-deprecated python3-flake8-docstrings \
            python3-flake8-import-order python3-flake8-quotes

      # Covers every package, including the ones ci.yml cannot build yet.
      - name: package.xml is well-formed
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          ament_xmllint $(find . -name package.xml -not -path './extern/*')

      # Runs each package's own test_flake8.py / test_pep257.py so CI and
      # `colcon test` stay in agreement about the configured style. Every Python
      # package that ships those tests is listed; a package added without one
      # is not linted until it gets them.
      - name: flake8 + pep257 (Python packages)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          for pkg in \
              cho_bringup/cho_bringup_common \
              cho_task_manager \
              cho_perception/cho_object_pose \
              cho_sensor/hansung_scale/hansung_scale_driver; do
            echo "::group::${pkg}"
            # ls fails when one of the two is absent; keep the one that exists.
            tests=$(cd "${pkg}" && ls test/test_flake8.py test/test_pep257.py 2>/dev/null || true)
            (cd "${pkg}" && python3 -m pytest ${tests} -v)
            echo "::endgroup::"
          done

      # Every C++, Python and CMake source outside extern/ carries a copyright
      # and license header ament_copyright recognises; NOTICE ("File headers")
      # says which. setup.py is named explicitly (walking a directory,
      # ament_copyright skips the one beside a package.xml), and CMakeLists.txt,
      # which it never selects, is checked with its parser by the tools/ script.
      - name: Copyright headers
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          find . -type f \( -name '*.py' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
                             -o -name '*.c' -o -name '*.cc' -o -name '*.cxx' -o -name '*.hh' \
                             -o -name '*.hxx' -o -name '*.cmake' \) \
            -not -path './extern/*' -not -path './.git/*' -print0 \
            | xargs -0 ament_copyright
          python3 tools/ci/check_copyright_headers.py
