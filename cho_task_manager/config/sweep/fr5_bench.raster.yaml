# What the FR5 bench's recovery raster is, in bench terms. The joint
# configurations the tree actually reads are SOLVED from this file:
#
#   python3 scripts/solve_sweep_raster.py config/sweep/fr5_bench.raster.yaml \
#       --out config/sweep/fr5_bench.yaml
#
# Edit here, re-solve, commit both. Adjusting a joint angle in the generated
# file directly is the one thing not to do: the waypoints have to stay in one
# IK branch, and a hand-nudged one silently leaves it.

# The pattern, in prose, for the file this generates.
header: |
  A boustrophedon raster covering a search AREA: rows at constant x swept FAR
  TO NEAR, each row traversed in y with the direction alternating.

  THE POSE IS SET FROM THE CAMERA, NOT THE TOOL. Every waypoint puts the
  camera's optical axis PERPENDICULAR to the bench and its picture at a fixed
  heading -- the measured mount is composed in, which is why the joint angles
  do not look like a tool pointing down. They are not: the mount carries 17.3
  degrees between the camera's axis and the tool's, so the two cannot both be
  vertical, and it is the camera's that has to be. The tool ends up 17.3
  degrees off vertical in a FIXED direction, with its tip 0.59 m above the
  bench through the whole survey.

  IT COVERS AN AREA AND IS NOT AIMED AT AN OBJECT. What is being looked for is
  an object whose position is not known -- that is the whole situation -- so a
  raster centred on where a layout file thinks the tag is would be assuming the
  answer. The same raster serves every object, and in a run that is cheaper
  than it looks: the first sweep passes over the whole area, so anything else
  out there becomes visible during it and the next object's leaf skips without
  moving.

  GAMMA-SHAPED, NEVER L-SHAPED. Every lateral move happens at the top height
  and the only descent is vertical, at the end. Descending first and then
  translating drags the gripper across a bench with other glassware standing on
  it; translating first and then dropping straight down passes over everything.
  That is also why the close pass is a SINGLE cell: a row down there is lateral
  motion at low clearance, which is the shape being avoided. Consecutive
  waypoints are checked ALONG the joint-space line between them, not only at
  their endpoints, because two poses that each clear the bench can be joined by
  an interpolation that dips through it.

  ROW spacing and COLUMN spacing are separate because they do different jobs.
  Each ROW is one traverse across the bench, so the row spacing is how many
  times the arm sweeps left and right; the column spacing is how finely it
  stops within a traverse, and it is coarse because the field of view already
  covers the width.

  Both are tighter than coverage alone would ask for. The textbook boustrophedon
  rule is stripe = footprint x (1 - overlap), and this camera sees about 0.6 m
  across at the survey height, so coverage alone would want a single row. The
  motion has a second job: PARALLAX, a different line of sight to the same tag,
  which is the only thing that helps when something is standing in the way. It
  also buys the VIEWING ANGLE -- a tag seen at normal incidence is the worst
  case for AprilTag's planar pose -- and incidence comes from where the camera
  IS, not from where it points, so it is the lateral offset that provides it
  and not any tilt of the tool.

  THE AREA IS BOUNDED BY HOW FAR THE ARM SHOULD LEAN, not by where anything is.
  Its far edge keeps the elbow bent; reaching further straightens the arm out
  over a bench with glassware on it, for a view the camera's field of view
  already had.

  The sweep STOPS at the first viewpoint whose decode clears
  min_decision_margin, so the full raster only runs when nothing can be found
  -- and then it has looked everywhere it can reach.


# The bench plane the tag lies in, and the arm that looks at it.
bench_z_m: -0.014

robot:
  # Named the way a launch file names it, resolved through the ament index.
  package: cho_description_fr5
  xacro: urdf/fr5.urdf.xacro
  xacro_args:
    hardware: mock
    gripper: ag95
  arm_dof: 6
  # cho_robot_config/config/fr5.yaml poses.home['1'] -- where the tree enters a
  # sweep from, and what the first waypoint's duration is sized against.
  home: [-0.0836, -1.1209, -2.0723, -1.7125, 1.6049, 0.0798]

camera:
  # The measured mount, read from the file the static publisher reads, so the
  # poses solved here and the transform the robot publishes cannot disagree.
  package: cho_bringup_fr5
  extrinsics: config/real/camera_extrinsics.yaml
  name: wrist

raster:
  # The area to search, in the robot's BASE FRAME.
  #
  # THESE ARE CAMERA POSITIONS, NOT THE GROUND COVERED. What the camera sees
  # reaches well past them -- about 0.6 m across at the survey height -- so the
  # arm does not have to travel over a tag to read it. The far edge is set by
  # how far the arm should LEAN, not by where anything is: at x 0.58 the elbow
  # is still bent, and pushing it to 0.72 straightens the arm out over the
  # bench (cond(J) went to 44 there) for a view the camera already had.
  area:
    # Starts at the far edge and works back. y is symmetric about the base, so
    # each row is a full traverse from one side to the other and back on the
    # next -- which is what 'sweep left and right several times' means when it
    # is written down.
    x: [0.20, 0.60]
    y: [-0.30, 0.30]
  # How far apart the ROWS are -- each row is one left-and-right traverse, so
  # this is how many times the arm sweeps across. NINE passes, 0.60 m back to
  # 0.20 m, each a full 0.60 m of travel in y: the sweep is meant to look like
  # someone scanning a bench, not like three lines.
  row_spacing_m: 0.05
  # How finely each traverse is sampled. Coarse on purpose: the field of view
  # already covers the width, and the stops are there for parallax. Four stops
  # across 0.60 m.
  column_spacing_m: 0.20
  # Straight down. Tilting the tool does NOT buy viewing angle -- incidence is
  # set by where the camera is, and a tilt only moves the tag around within the
  # picture. Measured in simulation at 15 degrees: the incidence at the central
  # cell stayed at 1.3 degrees while the tag went from 15.1 to 22.2 degrees off
  # the optical axis at an offset cell, against a guaranteed half-cone of 29.
  # It spent field of view and bought nothing.
  tilt_deg: 0.0
  # The picture's roll is left FREE, and that is a trade rather than an
  # oversight. Commanding it (camera_up_heading_deg, which the solver still
  # accepts) stops the tool rotating as the camera translates and makes the
  # guaranteed field of view the full 87 x 58 rectangle instead of the short
  # 58 cone -- both real gains. It also makes the waypoint a 6-DOF pose, and
  # measured on this arm that costs the CLOSE PASS: at heading 180 the raster
  # came out 32 of 38 cells with `close_approach` and `close` among the
  # casualties, because a fixed attitude at 0.386 m is more than the wrist has
  # left. The Gamma-shaped descent is a safety property and the tool's slow
  # rotation is cosmetic, so the descent wins.
  #
  # Set camera_up_heading_deg only if the close pass is dropped or the arm
  # gains the wrist range to hold an attitude down there.
  # The first waypoint is a long swing from the home pose, not a raster step.
  # This cell commissions at 0.394 rad/s (cho_moveit_fr5/config/joint_limits.yaml).
  approach_duration_s: 12.0
  passes:
    # THE SEARCH. High, so one viewpoint already covers a good part of the area
    # and the cells are there for the lines of sight as much as the coverage.
    - name: survey
      height_m: 0.55
      duration_s: 3.0
    # THE CLOSE LOOK, for pixels. One cell, reached by a lateral move at the
    # survey height and then a vertical drop. It goes to the MIDDLE of the area
    # because it has no way of knowing where the search found something -- that
    # is the obvious thing to make adaptive, and until it is, this is a
    # fallback and not a second search.
    - name: close
      height_m: 0.40
      at_centre: true
      duration_s: 3.0


# What a solved waypoint has to satisfy to be kept. A cell that fails every one
# of these is dropped from the raster and named in the generated file, rather
# than being quietly replaced by something nearby.
# WHAT ELSE IS STANDING IN THE SEARCH AREA.
#
# Every clearance check below measures height above the bench, and the URDF
# holds the robot and nothing else -- so anything bolted into the cell inside
# the raster is invisible to the whole solve. The OAK is such a thing.
#
# THE POSITION COMES FROM THE EXTRINSICS FILE, and that is the point. Solving
# this against the extrinsic that used to be recorded put the OAK at
# (0.420, 0.152, 0.377), inside x [0.20, 0.60] by y [-0.30, 0.30] and 9 mm
# below the close pass, with the AG-95 finger passing 69 mm from it -- a
# frightening number that was an artefact of a stale file. The camera was
# actually 481 mm away from there. Calibrated properly it sits at y = 0.58,
# OUTSIDE the search area and above it, and the measured worst approach over
# the whole raster is 330 mm.
#
# So this section currently costs nothing, and it stays for two reasons: the
# OAK is a real object in the cell that the robot model does not contain, and
# `from_extrinsics` means re-running the calibration re-aims the keep-out
# without anyone remembering to. If the tripod is ever moved back over the
# bench, the solve will drop the cells that would have hit it instead of
# finding out the hard way.
#
# radius_m is the OAK's own bulk and checks.min_obstacle_clearance_m is the
# robot's, since the checked frames are points and the gripper around them is
# not. Both are PROVISIONAL -- sized to cover an OAK-D Pro W (about
# 100 x 33 x 43 mm) on a mount nobody has measured. Measure the installation
# before relying on them.
obstacles:
  - name: side_1
    from_extrinsics: side_1
    radius_m: 0.10

checks:
  max_position_error_m: 0.005
  max_axis_error_deg: 1.0
  min_joint_margin_rad: 0.30
  max_condition: 45.0
  # Over the BENCH, not the base. There is other glassware down there -- the
  # tallest vessel is about 85 mm -- and the arm passes over the cell rather
  # than through it.
  min_tool_over_bench_m: 0.25
  min_arm_over_bench_m: 0.12
  # Between consecutive waypoints. A raster that flipped elbow-up to elbow-down
  # between two cells would swing the arm through space nothing has checked.
  max_step_rad: 1.0
  # The same clearances, but along the joint-space line BETWEEN two waypoints
  # rather than at them. Slightly lower than the endpoint figures on purpose: a
  # joint-space straight line bulges in Cartesian space, and refusing every
  # bulge would leave the raster with no reachable path at all.
  min_path_tool_over_bench_m: 0.20
  min_path_arm_over_bench_m: 0.10
  min_obstacle_clearance_m: 0.12
  tool_frames: [tool_tcp, gripper_base_link, gripper_finger_link, wrist3_link]
  arm_frames: [upperarm_link, forearm_link, wrist1_link, wrist2_link]

solver:
  tries: 120

# Carried through to the generated file unchanged.
defaults:
  recovery_camera: wrist
  waypoint_duration: 3.0
  dwell_sec: 1.5
  min_decision_margin: 55.0

  # OFF, and likely to stay off. The simulated cell tried this instead of the
  # decode margin, on the reasoning that margin tracks readability while
  # apparent size tracks accuracy. Measuring the cell showed apparent size does
  # not track it either once obliquity varies: two standing cameras 57% apart
  # in accuracy reported 32.8 and 33.4 px, the nearer one being the more
  # oblique. It separates a wrist close-up from a standing view and nothing
  # finer. `planning_target` below is the criterion that replaced it.
  #
  # If it is ever set here it needs measuring HERE: this bench's tag is 39 mm
  # against the cell's 100, so the same standoff gives well under half the
  # pixels. Read `edge Mpx` out of the pose node's report at the OAK and at a
  # sweep waypoint, and set it between them.
  min_tag_edge_px: 0.0

  # The vessels this tree locates are the ones the arm then picks up, so each
  # wants the wrist's own measurement rather than the OAK's oblique one. Set
  # per-object, or overridden per-stage by the task -- see the cell spec, which
  # carries the measurements this rule came from.
  planning_target: true
  # The whole raster, moves included: 12 s of approach plus 37 steps of 3 s
  # plus 38 dwells of 1.5 s is about 180 s. This is the WORST case and only
  # happens when nothing can be found anywhere; a run that finds its object
  # stops there, which on this bench is usually within the first row or two.
  timeout_sec: 320.0

objects:
  # Only the names. The raster is the same for all of them -- it is a search of
  # an area, not an approach to a position -- so there is nothing per-object
  # left to state here.
  - object: beaker
  - object: flask
