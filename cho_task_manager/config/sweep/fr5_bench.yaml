# GENERATED by scripts/solve_sweep_raster.py -- do not hand-edit.
# Source: fr5_bench.raster.yaml
#
# Re-solve it rather than adjusting a number here, or the waypoints stop
# agreeing with each other about which IK branch they are in. From the
# cho_task_manager source directory:
#
#   python3 scripts/solve_sweep_raster.py config/sweep/fr5_bench.raster.yaml --out config/sweep/fr5_bench.yaml
#
# A boustrophedon raster covering a search AREA: rows at constant x swept FAR
# TO NEAR, each row traversed in y with the direction alternating.
#
# THE POSE IS SET FROM THE CAMERA, NOT THE TOOL. Every waypoint puts the
# camera's optical axis PERPENDICULAR to the bench and its picture at a fixed
# heading -- the measured mount is composed in, which is why the joint angles
# do not look like a tool pointing down. They are not: the mount carries 17.3
# degrees between the camera's axis and the tool's, so the two cannot both be
# vertical, and it is the camera's that has to be. The tool ends up 17.3
# degrees off vertical in a FIXED direction, with its tip 0.59 m above the
# bench through the whole survey.
#
# IT COVERS AN AREA AND IS NOT AIMED AT AN OBJECT. What is being looked for is
# an object whose position is not known -- that is the whole situation -- so a
# raster centred on where a layout file thinks the tag is would be assuming the
# answer. The same raster serves every object, and in a run that is cheaper
# than it looks: the first sweep passes over the whole area, so anything else
# out there becomes visible during it and the next object's leaf skips without
# moving.
#
# GAMMA-SHAPED, NEVER L-SHAPED. Every lateral move happens at the top height
# and the only descent is vertical, at the end. Descending first and then
# translating drags the gripper across a bench with other glassware standing on
# it; translating first and then dropping straight down passes over everything.
# That is also why the close pass is a SINGLE cell: a row down there is lateral
# motion at low clearance, which is the shape being avoided. Consecutive
# waypoints are checked ALONG the joint-space line between them, not only at
# their endpoints, because two poses that each clear the bench can be joined by
# an interpolation that dips through it.
#
# ROW spacing and COLUMN spacing are separate because they do different jobs.
# Each ROW is one traverse across the bench, so the row spacing is how many
# times the arm sweeps left and right; the column spacing is how finely it
# stops within a traverse, and it is coarse because the field of view already
# covers the width.
#
# Both are tighter than coverage alone would ask for. The textbook boustrophedon
# rule is stripe = footprint x (1 - overlap), and this camera sees about 0.6 m
# across at the survey height, so coverage alone would want a single row. The
# motion has a second job: PARALLAX, a different line of sight to the same tag,
# which is the only thing that helps when something is standing in the way. It
# also buys the VIEWING ANGLE -- a tag seen at normal incidence is the worst
# case for AprilTag's planar pose -- and incidence comes from where the camera
# IS, not from where it points, so it is the lateral offset that provides it
# and not any tilt of the tool.
#
# THE AREA IS BOUNDED BY HOW FAR THE ARM SHOULD LEAN, not by where anything is.
# Its far edge keeps the elbow bent; reaching further straightens the arm out
# over a bench with glassware on it, for a view the camera's field of view
# already had.
#
# The sweep STOPS at the first viewpoint whose decode clears
# min_decision_margin, so the full raster only runs when nothing can be found
# -- and then it has looked everywhere it can reach.

