[develop]
script_dir=$base/lib/cho_task_manager
[install]
install_scripts=$base/lib/cho_task_manager
[flake8]
max-line-length = 120
extend-ignore = E122,E231,E252,E261,E301,E302,E303,E305,E501,E701,F401,W291,W292,W293
exclude =
    python
per-file-ignores =
    __init__.py:F401
[pep257]
add-ignore = D100,D101,D102,D103,D104,D105,D107,D203,D204,D205,D212,D213,D400,D401,D415
match-dir = (?!python).*
