[develop]
script_dir=$base/lib/cho_task_manager
[install]
install_scripts=$base/lib/cho_task_manager

[tool:pytest]
addopts = -p no:anyio
[flake8]
max-line-length = 120
# E302 still has findings (3, utils/msg_utils.py); every other code that was
# ignored here is clean and enforced.
extend-ignore = E302
exclude =
    python
per-file-ignores =
    __init__.py:F401
[pep257]
add-ignore = D100,D101,D102,D103,D104,D105,D107,D203,D204,D205,D212,D213,D400,D401,D415
match-dir = (?!python).*
