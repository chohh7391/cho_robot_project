# Franka OperationalSpaceController parameters (generate_parameter_library).
#
# Range checks live here. Left to the controller, at configure: the sizes of
# kp_task, kd_task (6) and default_dof_pos (7), and the strictly positive
# entries of inertia_scale (the library's element bounds are inclusive). Those
# three default to empty so that a controller loaded first and given its gains
# after (ros2 control load_controller, then set; the test harness) still loads;
# one never given them fails to configure, as before.
#
# The base class declares its own parameters (robot_type, bringup_type, ee_name,
# mass, center_of_mass, load_inertia, rotor_inertia), not listed here.
franka_operational_space_controller:
  kp_task:
    type: double_array
    default_value: []
    description: >-
      Task stiffness [x, y, z, rx, ry, rz], in the EE frame, at the
      acceleration level [1/s^2]; the wrench is Lambda times it.
    validation:
      lower_element_bounds<>: [0.0]
  kd_task:
    type: double_array
    default_value: []
    description: "Task damping [x, y, z, rx, ry, rz], acceleration level [1/s]."
    validation:
      lower_element_bounds<>: [0.0]
  kp_null:
    type: double
    default_value: 10.0
    description: "Stiffness of the null-space posture torque toward default_dof_pos [N m/rad]."
    validation:
      gt_eq<>: [0.0]
  kd_null:
    type: double
    default_value: 1.0
    description: "Damping of the null-space posture torque [N m s/rad]."
    validation:
      gt_eq<>: [0.0]
  default_dof_pos:
    type: double_array
    default_value: []
    description: "Arm posture the null-space torque pulls toward [rad], 7 entries."
  use_nullspace_posture:
    type: bool
    default_value: false
    description: "Add the dynamically consistent null-space posture torque toward default_dof_pos."
  velocity_filter_alpha:
    type: double
    default_value: 0.99
    description: >-
      Weight of the new sample in the joint-velocity filter used by the damping
      term, dq_f = (1 - alpha) dq_f + alpha v. 1 is the raw velocity.
    validation:
      gt<>: [0.0]
      lt_eq<>: [1.0]
  inertia_scale:
    type: double_array
    default_value: [1.0, 1.0, 1.0, 1.0, 6.0, 6.0, 10.0]
    description: >-
      Factor on each diagonal entry of the arm mass matrix the controller uses
      for Lambda, M^-1 and the null-space projector. The FR3 wrist links are
      light against their reflected rotor inertia, which the URDF cannot
      express; the factors stand in for it. The base's rotor_inertia parameter
      adds that inertia to M itself, so with rotor_inertia set the two compound:
      set one or the other.
    validation:
      fixed_size<>: [7]
      lower_element_bounds<>: [0.0]
  joint_damping:
    type: double_array
    default_value: [4.47213595499958, 4.47213595499958, 4.47213595499958, 4.47213595499958, 0.2, 0.2, 0.2]
    description: >-
      Joint damping in the torque law, tau -= joint_damping * dq_f [N m s/rad].
      Default 2 sqrt(5) on joints 1-4 and 0.2 on the wrist.
    validation:
      fixed_size<>: [7]
      lower_element_bounds<>: [0.0]
