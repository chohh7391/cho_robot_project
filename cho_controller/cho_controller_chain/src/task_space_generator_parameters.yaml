# TaskSpaceGenerator parameters (generate_parameter_library).
#
# Every parameter has a default, so the controller loads before they are set.
# The Cartesian limits (cartesian_limits.*) are declared by
# cho_controller_common's loader, and control_mode and the success thresholds
# by the action server, not here.
chain_task_space_generator:
  robot_description:
    type: string
    default_value: ""
    description: >-
      The URDF the IK model is built from. Empty: fetched from
      robot_state_publisher at configure; still empty, configure fails.
  joints:
    type: string_array
    default_value: []
    description: >-
      The joints the generator drives, as the law's `joints`, in the model's
      kinematic order. Configure fails when empty.
    validation:
      unique<>: []
  law_name:
    type: string
    default_value: "chain_impedance_law"
    description: >-
      The impedance law whose reference interfaces this generator claims
      (<law_name>/<joint>/position, velocity, acceleration).
    validation:
      not_empty<>: []
  ee_frame:
    type: string
    default_value: ""
    description: >-
      The EE frame a goal moves, and the frame a relative goal is stamped in.
      Configure fails when empty or not a frame of the model.
  ik_damping:
    type: double
    default_value: 0.01
    description: "Damping lambda of the damped-least-squares IK step."
    validation:
      gt<>: [0.0]
  ik_gain:
    type: double
    default_value: 50.0
    description: >-
      Rate [1/s] at which the IK closes the error to the trajectory's target;
      gain * dt is clamped to at most 0.5 at run time.
    validation:
      gt<>: [0.0]
  max_joint_velocity:
    type: double
    default_value: 2.0
    description: >-
      Largest joint reference velocity [rad/s]: the whole IK step is scaled so
      every joint moves at most this times dt per cycle.
    validation:
      gt<>: [0.0]
