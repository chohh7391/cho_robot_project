# JointImpedanceLaw parameters (generate_parameter_library).
#
# Every parameter has a default, so the controller loads before they are set.
# Range checks live here; the sizes against `joints`, the finite checks and the
# URDF's effort limits are checked in on_configure.
chain_joint_impedance_law:
  robot_description:
    type: string
    default_value: ""
    description: >-
      The URDF the law's Pinocchio model is built from. Empty: fetched from
      robot_state_publisher at configure; still empty, configure fails.
  joints:
    type: string_array
    default_value: []
    description: >-
      The joints the law drives, in the model's kinematic order. Every other
      joint of the URDF is locked at its neutral position. Configure fails when
      empty.
    validation:
      unique<>: []
  kp:
    type: double_array
    default_value: []
    description: >-
      Stiffness per joint as an acceleration gain [1/s^2]: the torque is
      M(q) Kp (q_ref - q). One finite entry >= 0 per joint.
    validation:
      lower_element_bounds<>: [0.0]
  kd:
    type: double_array
    default_value: []
    description: >-
      Damping per joint as an acceleration gain [1/s]: the torque is
      M(q) Kd (v_ref - dq). One finite entry >= 0 per joint.
    validation:
      lower_element_bounds<>: [0.0]
  effort_limits:
    type: double_array
    default_value: []
    description: >-
      Torque clip per joint [N m]. Empty: the URDF's effort limits (each must
      then be finite and > 0); else one finite entry > 0 per joint.
  compensate_gravity:
    type: bool
    default_value: true
    description: >-
      Add g(q) to the torque. False where the robot compensates gravity itself.
  rotor_inertia:
    type: double_array
    default_value: []
    description: >-
      Reflected rotor inertia per joint [kg m^2], written to the model's
      armature, so M(q) includes it. Empty: none; else one finite entry >= 0
      per joint.
    validation:
      lower_element_bounds<>: [0.0]
