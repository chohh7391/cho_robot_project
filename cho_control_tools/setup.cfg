[develop]
script_dir=$base/lib/cho_control_tools

[install]
install_scripts=$base/lib/cho_control_tools

[tool:pytest]
addopts = -p no:anyio

[flake8]
max-line-length = 120
# Codes that still have findings (E122 1, E261 5, E302 11, E303 2, E305 2,
# E701 6). Every other code that was ignored here is clean and enforced.
# A,B90,C4,C81,CNL,D,I,Q: the optional flake8 plugins' rules, pinned off as in cho_task_manager.
extend-ignore = E122,E261,E302,E303,E305,E701,A,B90,C4,C81,CNL,D,I,Q
per-file-ignores =
    __init__.py:F401

[pep257]
add-ignore = D100,D101,D102,D103,D104,D105,D107,D203,D204,D205,D212,D213,D400,D401,D415
