[develop]
script_dir=$base/lib/cho_control_tools

[install]
install_scripts=$base/lib/cho_control_tools

[tool:pytest]
addopts = -p no:anyio

[flake8]
max-line-length = 120
# A,B90,C4,C81,CNL,D,I,Q: the optional flake8 plugins' rules, pinned off as in cho_task_manager.
# Every pycodestyle and pyflakes code is enforced by test/test_flake8.py.
extend-ignore = A,B90,C4,C81,CNL,D,I,Q
per-file-ignores =
    __init__.py:F401

[pep257]
add-ignore = D100,D101,D102,D103,D104,D105,D107,D203,D204,D205,D212,D213,D400,D401,D415
