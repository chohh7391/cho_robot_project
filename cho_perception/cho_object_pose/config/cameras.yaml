# The cameras watching the bench, and how each one's detections are kept apart.
#
# Read by TWO things, which is why it is a file and not a set of launch
# arguments: `launch/detectors.launch.py` starts one detector per entry, and
# `object_pose_node` subscribes to every entry's detections topic and looks up
# that entry's tag frames. Two lists of three cameras would drift; this cannot.
#
# `frame_prefix` is the field that has to be right. Two detectors left at the
# default would both publish `tag_0`, and one TF child would gain two parents --
# no error, just transforms that intermittently resolve through the wrong
# camera. The parser rejects duplicates for that reason.
#
# Fusing them is what buys the accuracy: every camera's view of a tag lands in
# the same aggregation window, so the published position is the MEDIAN across
# all of them and one camera's bad view is outvoted rather than believed. It
# also turns `max_position_spread_m` into a check on the extrinsics -- three
# cameras that disagree by more than the gate publish nothing, which is the
# honest answer when nobody knows where the cameras are.
#
# `priority` is the exception to that, and the reason it exists is below: a
# recovery sweep is not another vote, it is a better measurement.
#
# This file does NOT start the cameras themselves. `cho_realsense` and
# `cho_oak` do that, and the image topics below are what they publish:
#
#   ros2 launch cho_oak       oak.launch.py  name:=oak
#   ros2 launch cho_realsense d435.launch.py camera_namespace:=rs_left  camera_name:=rs_left  serial_no:=_<serial>
#   ros2 launch cho_realsense d435.launch.py camera_namespace:=rs_right camera_name:=rs_right serial_no:=_<serial>
#
# The two D435 serials are in cho_camera_calibration/config/cameras.yaml. SET
# THEM: an empty serial opens whichever unit the driver finds first, so with two
# on the bench which one you got -- and therefore which calibration applies --
# is undefined.
cameras:
  # THE TWO CAMERAS HAVE DIFFERENT JOBS, and it is worth knowing which:
  #
  #   oak    the standing observer. Wide, far, always looking -- this is what
  #          locates the vessels when nothing is in the way.
  #   wrist  the recovery instrument. When the arm occludes something the OAK
  #          needs, a task sweeps the wrist over it from above and the close
  #          view updates that object's pose.
  #
  # They are therefore NOT redundant views of one scene, and `priority` is what
  # says so. Cameras at equal priority are fused as described above; a camera at
  # a HIGHER one REPLACES the lower ones' samples, for the objects it can
  # currently see and only for those. Without it the node would median a
  # 200 mm close-up together with a 1 m wide-angle view and publish a pose
  # neither camera saw -- or, once they disagreed by more than
  # max_position_spread_m, publish nothing at all during exactly the sweep that
  # was meant to fix things.
  #
  # The override is self-clearing and needs no expiry of its own: it lasts as
  # long as the wrist has samples IN THE AGGREGATION WINDOW, so when the arm
  # moves away those age out after window_sec and the OAK is believed again.
  # A recovered pose is therefore exactly as long-lived as any other -- a task
  # that needs to keep it latches it (PoseTargetBehavior), which is what every
  # task already does.
  #
  # TWO THINGS TO KNOW BEFORE RAISING A PRIORITY:
  #
  #   * `min_cameras` is not applied to an object while an override is in force.
  #     Demanding that several cameras agree and declaring one of them
  #     authoritative are contradictory; with both, the wrist would suppress the
  #     OAK and then fail its own quorum, and the object would go dark during
  #     the sweep. min_samples and max_position_spread_m still apply, within the
  #     winning camera's own samples.
  #   * The wrist's extrinsic is now load-bearing rather than a cross-check.
  #     cho_bringup_fr5/config/real/camera_extrinsics.yaml puts it at about
  #     7 mm, measured from the mount rather than solved -- fine for a close-up
  #     approach, and the number to improve if a recovered pose is used for
  #     anything tighter.

  # Wrist-mounted D435, eye-in-hand. Its transform comes from the ROBOT's TF
  # (wrist3_link -> wrist_link), not from a static publisher, because it moves
  # with the arm -- so the robot bringup has to be running for this one to
  # resolve. infra1 is global shutter, which is the reason a wrist mount uses
  # it rather than the rolling-shutter colour stream.
  - name: wrist
    image_topic: /wrist/wrist/infra1/image_rect_raw
    rectify: false
    frame_prefix: wrist_
    detections_topic: /wrist/detections
    # Outranks the standing observer. Only ever compared, never scaled, so the
    # gap to the OAK's 0 means nothing beyond "higher".
    priority: 10
    # Drawn at the driver's own camera_link, with the mounting pose copied
    # verbatim out of realsense2_description/urdf/_d435.urdf.xacro:
    #   xyz  d435_zero_depth_to_glass + d435_glass_to_front, -d435_cam_depth_py, 0
    #   rpy  pi/2 0 pi/2
    # Needs the mesh package, which is NOT pulled in by the driver:
    #   sudo apt install ros-humble-realsense2-description
    # Without it rviz logs that it cannot load the resource and draws nothing;
    # everything else keeps working.
    visual:
      frame: wrist_link
      mesh: package://realsense2_description/meshes/d435.dae
      xyz: [0.0043, -0.0175, 0.0]
      rpy: [1.5708, 0.0, 1.5708]

  # OAK-D Pro W, eye-to-hand. The driver rectifies RGB only and the wide lens is
  # an eight-coefficient rational_polynomial, so the mono stream needs image_proc
  # ahead of the detector -- that is what rectify: true inserts.
  - name: oak
    image_topic: /oak/left/image_raw
    rectify: true
    frame_prefix: oak_
    detections_topic: /oak/detections
    # The default, spelled out because this file is where the two cameras'
    # relationship is documented and an implicit 0 says nothing.
    priority: 0
    # `oak_model_origin` is the frame depthai_descriptions puts this very mesh
    # at, already rotated there (rpy 1.5708 0 1.5708 off the base frame), so
    # the offset here is zero. The driver publishes the frame; the mesh ships
    # with depthai_descriptions, which the OAK stack already depends on.
    visual:
      frame: oak_model_origin
      mesh: package://depthai_descriptions/urdf/models/OAK-D-PRO-W.stl
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
