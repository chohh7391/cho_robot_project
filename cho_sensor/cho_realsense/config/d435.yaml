# infra1 only, Y8, emitter off: the global-shutter IR image is what the tag
# detector wants, and the dot projector's pattern breaks tag decoding.
depth_module.infra1_format: 'Y8'
enable_depth: false
enable_infra2: false

# AUTO EXPOSURE IS OFF, and this is not a preference.
#
# The FR5 bench is an aluminium extrusion top under room lighting. Auto
# exposure meters the whole frame, the bench dominates it, and the result is
# 79% saturated pixels with a mean of 229/255 -- the tag board vanishes into
# white and decodes nothing at all. Measured on this bench with the shipped
# setting; the first wrist image was blank paper with a ghost where six tags
# should have been.
#
# 1000 us gives a mean of 82 with 2.6% saturated and the tag borders intact,
# and the detector reads all six at margins of 144-177. It is a BENCH number,
# not a camera number: a different room or a matt-black table wants a different
# one. Re-take it by sweeping and looking at the saturated fraction, not at the
# mean -- the mean is dominated by the bench either way.
#
# SET IT HERE, NEVER WITH `ros2 param set`. Changing exposure at runtime makes
# the driver stop and restart the depth module, which comes back with
# "xioctl(VIDIOC_S_FMT) failed, errno=16 Device or resource busy" and holds the
# camera in that state until the node is killed. Measured, twice.
depth_module.enable_auto_exposure: false
depth_module.exposure: 1000
depth_module.gain: 16

publish_tf: true
depth_module.emitter_enabled: 0
