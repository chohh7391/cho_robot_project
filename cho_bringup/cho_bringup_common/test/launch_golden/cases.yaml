# The launch argument variants test_launch_golden.py evaluates, and the reason
# printed when a whole bringup package is skipped.
#
#   cases:
#     <bringup package>:
#       <file under share/<package>/launch/>:
#         <case name>: [name:=value, ...]
#
# Each case's expected output is expected/<package>/<launch stem>/<case>.txt.
# Every launch file a bringup package installs must have at least one case, and
# every controller name cho_robot_config gives a robot must be spawned by one of
# its cases (test_golden_registry_names.py; a bimanual:=true case serves the
# robot's arm profiles, every other case its single profile).
#
# $FAKE is a scratch directory holding a stub isaacsim/python.sh (never run;
# check_isaac_install only looks for it) and an empty usd/robot/robot.usda (two
# levels deep: the FR5 bringup passes the USD's grandparent to the converter),
# so the Isaac bringups evaluate without Isaac. `defaults` are set before every
# case's own arguments and are not printed: no case depends on whether Isaac is
# installed here. A case that leaves robot_usd at its default expects that USD not to
# exist; on a machine where it has been built that case reports as skipped.
#
# Regenerating after an intended launch change: see test_launch_golden.py.

defaults:
  - isaac_sim_path:=$FAKE/isaacsim

# Why a bringup package may be absent. CI builds all four and requires them
# (CHO_LAUNCH_GOLDEN_REQUIRE): their hardware and Franka source-only exec_depends
# are skipped there and franka_gripper / franka_ign_ros2_control are empty
# stand-ins, since a launch only looks them up; see .github/workflows/ci.yml.
not_installed:
  cho_bringup_franka: >-
    not built in this workspace - build it (its franka_ros2 exec_depends are not
    needed to evaluate its launch files)
  cho_bringup_openarm: >-
    not built in this workspace - build it (its hardware exec_depends are not
    needed to evaluate its launch files)

cases:
  cho_bringup_franka:
    bringup_gz_robot.launch.py:
      default: []
      position_ik: [control_mode:=position, controller_name:=task_space_ik_controller]
      action_chunk: [action_chunk:=true]
      bare_no_rviz: [load_gripper:=false, launch_rviz:=false]
      mounted: [ee_connection_xacro:=$FAKE/ee_connection.xacro, special_connection:=adapter,
                payload_file:=$FAKE/payload.yaml]
      no_hand_tcp_refused: [load_gripper:=false, ee_name:=fr3_hand_tcp]
      moveit_controller: [load_moveit_controller:=true, control_mode:=position,
                          controller_name:=joint_space_position_controller]
      mode_mismatch: [control_mode:=position]
      namespace_refused: [namespace:=ns1]
      moveit_refused: [controller_name:=moveit]
    bringup_gz_moveit.launch.py:
      default: []
    bringup_mujoco_robot.launch.py:
      default: []
      position: [control_mode:=position, controller_name:=joint_space_position_controller]
      velocity: [control_mode:=velocity, controller_name:=joint_space_velocity_controller]
      action_chunk: [action_chunk:=true]
      action_chunk_position: [action_chunk:=true, control_mode:=position]
      no_gripper: [load_gripper:=false]
      action_chunk_controller_position: [controller_name:=action_chunk_controller, control_mode:=position]
      mode_mismatch: [control_mode:=position]
      controller_mismatch: [controller_name:=joint_space_position_controller]
      moveit_controller: [load_moveit_controller:=true, control_mode:=position,
                          controller_name:=joint_space_position_controller]
      moveit_controller_refused: [load_moveit_controller:=true]
      payload: [payload_file:=$FAKE/payload.yaml]
      world: [mujoco_world:=$FAKE/world.xml, control_mode:=position,
              controller_name:=joint_space_position_controller]
      plugins: [mujoco_plugins:=$FAKE/plugins.yaml]
    bringup_real_robot.launch.py:
      default: []
      position_ik: [control_mode:=position, controller_name:=task_space_ik_controller]
      no_gripper: [load_gripper:=false]
      no_gripper_link8: [load_gripper:=false, ee_name:=fr3_link8]
      no_hand_tcp_refused: [load_gripper:=false, ee_name:=fr3_hand_tcp]
      action_chunk: [action_chunk:=true]
      mode_mismatch: [control_mode:=position]
      mounted: [ee_connection_xacro:=$FAKE/ee_connection.xacro, special_connection:=adapter,
                payload_file:=$FAKE/payload.yaml]
    bringup_isaac_robot.launch.py:
      default_usd: []
      default: [robot_usd:=$FAKE/usd/robot/robot.usda]
      position: [robot_usd:=$FAKE/usd/robot/robot.usda, control_mode:=position,
                 controller_name:=joint_space_position_controller]
      ft_headless_cuda: [robot_usd:=$FAKE/usd/robot/robot.usda, ft_link:=fr3_link8, headless:=true, device:=cuda]
      no_gripper: [robot_usd:=$FAKE/usd/robot/robot.usda, load_gripper:=false]
      mode_mismatch: [robot_usd:=$FAKE/usd/robot/robot.usda, control_mode:=velocity]
      velocity: [robot_usd:=$FAKE/usd/robot/robot.usda, control_mode:=velocity,
                 controller_name:=joint_space_velocity_controller]
      action_chunk: [robot_usd:=$FAKE/usd/robot/robot.usda, action_chunk:=true]
      gate_failure_shutdown: [robot_usd:=$FAKE/usd/robot/robot.usda, shutdown_on_gate_failure:=true]

  cho_bringup_ur:
    bringup_gz_robot.launch.py:
      default: []
      ik_headless: [controller_name:=task_space_ik_controller, load_gripper:=false, gazebo_gui:=false,
                    launch_rviz:=false, use_sim_time:=false]
      joint_trajectory: [controller_name:=joint_trajectory_controller]
      moveit_refused: [controller_name:=moveit]
      unknown_controller: [controller_name:=bogus]
    bringup_gz_moveit.launch.py:
      default: []
    bringup_mujoco_robot.launch.py:
      default: []
      ik_wrist: [controller_name:=task_space_ik_controller, ee_name:=wrist_3_link]
      moveit_controller: [load_moveit_controller:=true]
      unknown_controller: [controller_name:=bogus]
    bringup_real_robot.launch.py:
      default: [robot_ip:=192.168.1.10]
      ik: [robot_ip:=192.168.1.10, controller_name:=task_space_ik_controller]
    bringup_isaac_robot.launch.py:
      default_usd: []
      default: [robot_usd:=$FAKE/usd/robot/robot.usda]
      ik_headless: [robot_usd:=$FAKE/usd/robot/robot.usda, controller_name:=task_space_ik_controller, headless:=true]
      unknown_controller: [robot_usd:=$FAKE/usd/robot/robot.usda, controller_name:=bogus]
      no_isaac: [robot_usd:=$FAKE/usd/robot/robot.usda, isaac_sim_path:=$FAKE/no_isaacsim]
      gate_failure_shutdown: [robot_usd:=$FAKE/usd/robot/robot.usda, shutdown_on_gate_failure:=true]
      # Refused before the runtime parameter file is written, so none is left.
      bad_gate_bool: [robot_usd:=$FAKE/usd/robot/robot.usda, shutdown_on_gate_failure:=maybe]

  cho_bringup_fr5:
    bringup_gz_robot.launch.py:
      default: []
      ik_headless: [controller_name:=task_space_ik_controller, gazebo_gui:=false, launch_rviz:=false,
                    use_sim_time:=false]
      moveit_refused: [controller_name:=moveit]
    bringup_gz_moveit.launch.py:
      default: []
    bringup_isaac_robot.launch.py:
      default_usd: []
      default: [robot_usd:=$FAKE/usd/robot/robot.usda]
      ik_headless: [robot_usd:=$FAKE/usd/robot/robot.usda, controller_name:=task_space_ik_controller, headless:=true]
      unknown_controller: [robot_usd:=$FAKE/usd/robot/robot.usda, controller_name:=bogus]
      gate_failure_shutdown: [robot_usd:=$FAKE/usd/robot/robot.usda, shutdown_on_gate_failure:=true]
    bringup_isaac_moveit.launch.py:
      default_usd: []
      default: [robot_usd:=$FAKE/usd/robot/robot.usda]
    bringup_mujoco_robot.launch.py:
      default: []
      ik_ag95: [controller_name:=task_space_ik_controller, gripper:=ag95]
      load_gripper: [load_gripper:=true]
      gripper_contradiction: [gripper:=ag95, load_gripper:=false]
    bringup_mujoco_moveit.launch.py:
      default: []
      ag95: [gripper:=ag95]
    bringup_real_robot.launch.py:
      default: []
      bare_ik: [gripper:=none, controller_name:=task_space_ik_controller]
      gripper_ip: [load_gripper:=true, robot_ip:=10.0.0.5]
      bad_bool: [load_gripper:=maybe]
    bringup_real_moveit.launch.py:
      default: []
      bare: [gripper:=none]
    camera_extrinsics.launch.py:
      default: []

  cho_bringup_openarm:
    bringup_mujoco_robot.launch.py:
      default: []
      bimanual: [bimanual:=true]
      position: [control_mode:=position, controller_name:=joint_space_position_controller]
      velocity_bimanual: [control_mode:=velocity, controller_name:=joint_space_velocity_controller,
                          bimanual:=true]
      no_hand: [hand:=false, ee_name:=openarm_hand]
      mit_headless: [mujoco_mit_prototype:=true, mujoco_mit_headless:=true]
      mit_joint_return_to_zero: [mujoco_mit_prototype:=true, mit_controller_name:=joint_impedance_mit_controller,
                                 return_to_zero:=true]
      mit_task_return_to_zero: [mujoco_mit_prototype:=true,
                                mit_controller_name:=task_space_impedance_mit_controller, return_to_zero:=true]
      mit_task_bimanual: [mujoco_mit_prototype:=true, mit_controller_name:=task_space_impedance_mit_controller,
                          bimanual:=true]
      mit_action_chunk: [mujoco_mit_prototype:=true, mit_controller_name:=action_chunk_mit_controller]
      mit_action_chunk_bimanual: [mujoco_mit_prototype:=true, mit_controller_name:=action_chunk_mit_controller, bimanual:=true]
      mit_fjt_both: [mujoco_mit_prototype:=true, bimanual:=true,
                     mit_controller_name:=bimanual_follow_joint_trajectory_mit_controller, mit_arm:=both]
      mit_fjt_left: [mujoco_mit_prototype:=true, bimanual:=true,
                     mit_controller_name:=single_arm_follow_joint_trajectory_mit_controller, mit_arm:=left]
      moveit_refused: [controller_name:=moveit]
    bringup_mujoco_moveit.launch.py:
      default: []
      bimanual_mit: [bimanual:=true, arm:=both, mujoco_mit_prototype:=true]
    bringup_real_robot.launch.py:
      default: []
      bimanual_hand: [bimanual:=true, hand:=true]
      task_return_to_zero: [controller_name:=task_space_impedance_mit_controller, return_to_zero:=true,
                            gravity_compensation:=true, gravity_scale:=1.2]
      action_chunk_right: [bimanual:=true, mit_arm:=right, controller_name:=action_chunk_mit_controller, return_to_zero:=true]
      action_chunk_return_to_zero: [controller_name:=action_chunk_mit_controller, return_to_zero:=true]
      rviz: [use_rviz:=true]
    bringup_isaac_robot.launch.py:
      default_usd: []
      bimanual_default_usd: [bimanual:=true]
      default: [robot_usd:=$FAKE/usd/robot/robot.usda]
      position: [robot_usd:=$FAKE/usd/robot/robot.usda, control_mode:=position,
                 controller_name:=joint_space_position_controller]
      newton_bimanual_position: [robot_usd:=$FAKE/usd/robot/robot.usda, bimanual:=true, physics_engine:=newton,
                                 control_mode:=position, controller_name:=joint_space_position_controller]
      velocity_headless: [robot_usd:=$FAKE/usd/robot/robot.usda, control_mode:=velocity,
                          controller_name:=joint_space_velocity_controller, headless:=true, ee_name:=openarm_hand]
      gate_failure_shutdown: [robot_usd:=$FAKE/usd/robot/robot.usda, shutdown_on_gate_failure:=true]
