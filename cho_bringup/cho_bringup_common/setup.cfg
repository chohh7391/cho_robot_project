[develop]
script_dir=$base/lib/cho_bringup_common
[install]
install_scripts=$base/lib/cho_bringup_common

[tool:pytest]
addopts = -p no:anyio
[flake8]
max-line-length = 120
# The optional flake8 plugins' rules are pinned off, so a machine with the ROS 2
# plugins (python3-flake8-{blind-except,builtins,class-newline,comprehensions,
# deprecated,docstrings,import-order,quotes}) and one without agree; this code
# is written to pycodestyle + pyflakes, and pep257 runs as its own test.
# A builtins, B90 blind-except, C4 comprehensions, C81 commas, CNL
# class-newline, D docstrings and deprecated, I import-order, Q quotes.
extend-ignore = A,B90,C4,C81,CNL,D,I,Q
per-file-ignores =
    __init__.py:F401
