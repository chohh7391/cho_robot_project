# This is a namespace agnostic configuration file for the Franka FR3 robot.
# That is to say, it is not tied to any specific namespace and can be used in
# any namespace. 
# If you require namespace specific configurations, you can easily modify this
# file to include the namespace
# As an example, below you can find:

# Imagine, you have a specific need to have the lock try count in namespace "NAMESPACE_X"
# to be different than the default value of 5, but leave all the other namespaces as default.
# Add the following lines to the configuration file 
# (or use a different config file, but then you have to mody the launch script to reference that file)


/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces:
          robot_state

      ee_state_broadcaster:
        type: cho_controller_franka/EEStateBroadcaster

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      task_space_ik_controller:
        type: cho_controller_franka/TaskSpaceIKController

      task_space_velocity_controller:
        type: cho_controller_franka/TaskSpaceVelocityController

      joint_space_velocity_controller:
        type: cho_controller_franka/JointSpaceVelocityController

      joint_space_position_controller:
        type: cho_controller_franka/JointSpacePositionController

      gravity_compensation_controller:
        type: cho_controller_franka/GravityCompensationController

      joint_space_impedance_controller:
        type: cho_controller_franka/JointSpaceImpedanceController

      task_space_impedance_controller:
        type: cho_controller_franka/TaskSpaceImpedanceController

      operational_space_controller:
        type: cho_controller_franka/OperationalSpaceController

      gripper_controller:
        type: cho_controller_franka/GripperController

      joint_space_qp_controller:
        type: cho_controller_franka/JointSpaceQPController

      task_space_qp_controller:
        type: cho_controller_franka/TaskSpaceQPController

      vla_controller:
        type: cho_controller_franka/VLAController

      joint_trajectory_controller:
        type: cho_controller_franka/JointTrajectoryController


/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      lock_try_count: 5 # Number of attempts to acquire the lock in a single on_update()
      lock_sleep_interval: 5 # microseconds sleep between attempts
      lock_log_error: true #  Log error if lock acquisition fails - false == do not log  
      lock_update_success: false # return update OK, although lock fails (no update occurs)

/**:
  joint_state_broadcaster:
    ros__parameters:
      robot_type: "fr3"
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7

/**:
  ee_state_broadcaster:
    ros__parameters:
      robot_type: "fr3"

/**:
  gripper_controller:
    ros__parameters:
      robot_type: "fr3"
      # Home (calibrate) the gripper on activation so grasp width takes effect
      # without a manual "initialize end effector" in Desk. Set false to skip.
      auto_home: true
      # Real robot can sense grasp success/failure, so surface failures to the BT.
      report_failure: true

/**:
  gravity_compensation_controller:
    ros__parameters:
      robot_type: "fr3"

/**:
  joint_space_position_controller:
    ros__parameters:
      robot_type: "fr3"

/**:
  task_space_ik_controller:
    ros__parameters:
      robot_type: "fr3"
      lambda: 0.01          # DLS damping factor
      max_delta_q: 0.0025   # per-step joint command limit [rad] (~2.5 rad/s @1kHz, under FR3 joint vel limits)

/**:
  task_space_velocity_controller:
    ros__parameters:
      robot_type: "fr3"
      lambda: 0.01          # DLS damping factor
      max_delta_q: 0.0025   # per-step reference slew [rad/cycle]
      # UNTESTED ON HARDWARE: start with low gains / low max_joint_vel and the e-stop in hand.
      kp_joint: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]  # hold/track P gain [1/s]
      max_joint_vel: 0.5    # output velocity clamp [rad/s]

/**:
  joint_space_velocity_controller:
    ros__parameters:
      robot_type: "fr3"
      # UNTESTED ON HARDWARE: start with low gains / low max_joint_vel and the e-stop in hand.
      kp_joint: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]  # hold/track P gain [1/s]
      max_joint_vel: 0.5    # output velocity clamp [rad/s]

/**:
  joint_space_impedance_controller:
    ros__parameters:
      robot_type: "fr3"
      kp_joint: [400.0, 500.0, 500.0, 400.0, 100.0, 100.0, 100.0]  # [400.0, 400.0, 400.0, 400.0, 100.0, 100.0, 100.0]
      kd_joint: [15.0, 15.0, 15.0, 15.0, 2.0, 2.0, 1.0]  # [10.0, 10.0, 10.0, 10.0, 2.0, 2.0, 2.0]

/**:
  task_space_impedance_controller:
    ros__parameters:
      robot_type: "fr3"
      kp_task: [300.0, 300.0, 300.0, 20.0, 20.0, 20.0]
      kd_task: [34.6410162, 34.6410162, 34.6410162, 0.89442719, 0.89442719, 0.89442719]
      kp_null: 10.0
      kd_null: 6.3246
      # enable after validating on the real robot (changes torque behavior)
      use_nullspace_posture: false
      default_dof_pos: [-1.3003, -0.4015, 1.1791, -2.1493, 0.4001, 1.9425, 0.4754]

/**:
  operational_space_controller:
    ros__parameters:
      robot_type: "fr3"
      kp_task: [100.0, 100.0, 100.0, 800.0, 800.0, 800.0]
      kd_task: [20.0, 20.0, 20.0, 56.57, 56.57, 56.57]
      kp_null: 10.0
      kd_null: 1.0
      # enable after validating on the real robot (changes torque behavior)
      use_nullspace_posture: false
      default_dof_pos: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854]

/**:
  joint_space_qp_controller:
    ros__parameters:
      robot_type: "fr3"
      kp_joint: [400.0, 400.0, 400.0, 400.0, 400.0, 400.0, 400.0]
      kd_joint: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]

/**:
  task_space_qp_controller:
    ros__parameters:
      robot_type: "fr3"
      kp_task: [100.0, 100.0, 100.0, 800.0, 800.0, 800.0]
      kd_task: [20.0, 20.0, 20.0, 56.57, 56.57, 56.57]
      kp_joint: [400.0, 400.0, 400.0, 400.0, 400.0, 400.0, 400.0]
      kd_joint: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      # ACTION-mode null-space posture task. Verified in MuJoCo; flip to true
      # after validating on the real robot (changes torque behavior).
      use_nullspace_posture: false
      nullspace_posture_weight: 1.0e-3

/**:
  vla_controller:
    ros__parameters:
      robot_type: "fr3"
      kp_task: [565.0, 565.0, 565.0, 28.0, 28.0, 28.0]  # [100.0, 100.0, 400.0, 30.0, 30.0, 30.0]
      kd_task: [47.54, 47.54, 47.54, 10.58, 10.58, 10.58]  # [20.0, 20.0, 40.0, 10.95, 10.95, 10.95]
      kp_null: 10.0
      kd_null: 6.3246
      # null-space posture kept OFF (owner decision; toggle available)
      use_nullspace_posture: false
      default_dof_pos: [-1.3003, -0.4015, 1.1791, -2.1493, 0.4001, 1.9425, 0.4754]
      default_kp_task: [300.0, 300.0, 300.0, 20.0, 20.0, 20.0]
      default_kd_task: [34.6410162, 34.6410162, 34.6410162, 0.89442719, 0.89442719, 0.89442719]

/**:
  joint_trajectory_controller:
    ros__parameters:
      robot_type: "fr3"
      kp_joint: [400.0, 500.0, 500.0, 400.0, 100.0, 100.0, 30.0]
      kd_joint: [15.0, 15.0, 15.0, 15.0, 2.0, 2.0, 1.0]
      duration: 6.0
