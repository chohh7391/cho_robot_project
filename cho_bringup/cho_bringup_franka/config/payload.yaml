# The Franka Hand alone: the end-effector payload of a description without the
# FT sensor, the real bringup's default. payload_ft_sensor.yaml is the hand with
# the Bota FT sensor.
/**:
  ros__parameters:
    mass: 0.73
    center_of_mass: [-0.01, 0.0, 0.03]
    load_inertia: [0.001, 0.0, 0.0,
                   0.0, 0.0025, 0.0,
                   0.0, 0.0, 0.0017]
