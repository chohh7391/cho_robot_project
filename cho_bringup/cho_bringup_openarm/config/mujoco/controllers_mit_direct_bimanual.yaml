# Opt-in OpenArm MIT direct-controller configuration for the bimanual MuJoCo
# model.  Each controller claims exactly one arm's 39 MIT interfaces.  The
# launch selector may activate left, right, or both instances concurrently;
# `both_independent` is intentionally not a 14-axis transaction.  MoveIt owns
# the only paired 14-axis controller in controllers_mit_moveit_bimanual.yaml.

/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      left_ee_state_broadcaster:
        type: cho_controller_openarm/EEStateBroadcaster
      right_ee_state_broadcaster:
        type: cho_controller_openarm/EEStateBroadcaster

      left_joint_impedance_mit_controller:
        type: cho_controller_openarm_mit/JointImpedanceMitActionController
      right_joint_impedance_mit_controller:
        type: cho_controller_openarm_mit/JointImpedanceMitActionController
      left_task_space_impedance_mit_controller:
        type: cho_controller_openarm_mit/TaskSpaceImpedanceMitController
      right_task_space_impedance_mit_controller:
        type: cho_controller_openarm_mit/TaskSpaceImpedanceMitController

      # One robot-independent gripper controller per hand. It claims only the
      # finger's position command interface, which no arm controller touches, so
      # it stays active alongside whichever arm controller is switched in.
      left_gripper_controller:
        type: cho_controller_gripper/GripperController
      right_gripper_controller:
        type: cho_controller_gripper/GripperController

  joint_state_broadcaster:
    ros__parameters:
      joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3,
               openarm_left_joint4, openarm_left_joint5, openarm_left_joint6,
               openarm_left_joint7, openarm_right_joint1, openarm_right_joint2,
               openarm_right_joint3, openarm_right_joint4, openarm_right_joint5,
               openarm_right_joint6, openarm_right_joint7,
               openarm_left_finger_joint1, openarm_right_finger_joint1]

  left_ee_state_broadcaster:
    ros__parameters:
      robot_type: openarm
      base_frame: openarm_body_link0
      ee_name: openarm_left_hand_tcp
      pose_topic: /ee_state/left/pose
      twist_topic: /ee_state/left/twist
      joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3,
               openarm_left_joint4, openarm_left_joint5, openarm_left_joint6,
               openarm_left_joint7]
      gripper_joint: openarm_left_finger_joint1
      gripper_mimic_joints: [openarm_left_finger_joint2]

  right_ee_state_broadcaster:
    ros__parameters:
      robot_type: openarm
      base_frame: openarm_body_link0
      ee_name: openarm_right_hand_tcp
      pose_topic: /ee_state/right/pose
      twist_topic: /ee_state/right/twist
      joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3,
               openarm_right_joint4, openarm_right_joint5, openarm_right_joint6,
               openarm_right_joint7]
      gripper_joint: openarm_right_finger_joint1
      gripper_mimic_joints: [openarm_right_finger_joint2]

  left_joint_impedance_mit_controller:
    ros__parameters:
      arm: left
      safety_profile_name: mujoco_sim_safe
      safety_profile_file: ''
      kp: [35.0, 35.0, 30.0, 25.0, 5.0, 5.0, 5.0]
      kd: [1.75, 1.5, 1.25, 1.25, 0.5, 0.45, 0.4]
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]

  right_joint_impedance_mit_controller:
    ros__parameters:
      arm: right
      safety_profile_name: mujoco_sim_safe
      safety_profile_file: ''
      kp: [35.0, 35.0, 30.0, 25.0, 5.0, 5.0, 5.0]
      kd: [1.75, 1.5, 1.25, 1.25, 0.5, 0.45, 0.4]
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]

  # Each Cartesian controller has its own robot-model joint map and TCP frame.
  # These targets are world-frame, not accumulating relative offsets. They are
  # evaluated from the matching arm's startup posture.
  left_task_space_impedance_mit_controller:
    ros__parameters:
      arm: left
      safety_profile_name: mujoco_sim_safe
      safety_profile_file: ''
      ee_frame: openarm_left_hand_tcp
      drive_side_impedance: true
      # Drive-side Cartesian impedance, sized for the SIM model: MuJoCo v1
      # declares no armature, so M_ii is roughly a quarter of the real arm's on
      # the elbow, and the MJCF's own joint damping="0.4" counts toward zeta.
      # kp_i = (kd_i + 0.4)^2 / (4 * 0.7^2) / M_ii,p95, clipped by
      # mujoco_sim_safe's kp_max - which is what binds the wrist at 10.
      kp: [13.0, 10.0, 32.0, 30.0, 10.0, 10.0, 10.0]
      kd: [2.75, 2.50, 2.00, 2.00, 0.70, 0.60, 0.50]
      startup_posture: [0.0, -0.5, 0.0, 1.2, 0.0, 0.4, 0.0]
      startup_kp: [35.0, 35.0, 30.0, 25.0, 5.0, 5.0, 5.0]
      startup_kd: [1.75, 1.5, 1.25, 1.25, 0.5, 0.45, 0.4]
      startup_duration: 5.0
      startup_tolerance: 0.05
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]
      kp_task: [150.0, 150.0, 150.0, 8.0, 8.0, 8.0]
      kd_task: [20.0, 20.0, 20.0, 1.2, 1.2, 1.2]
      max_task_wrench: [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]

      # Fix 1: only the model feed-forward (nle) is rate-limited by the profile
      # tau_ff_slew. The Cartesian PD, null-space and joint-limit torques are
      # bounded by max_task_wrench/torque_limit instead, so no rate limiter sits
      # inside the closed loop. Released/canceled references blend to the
      # measured pose over release_duration rather than stepping.
      release_duration: 1.0
      # Fix 2: dq_des = J^+ v_des during an action, so the in-motor kd tracks
      # the commanded motion instead of braking it (zero while idle).
      task_velocity_reference_damping: 0.01
      # Fix 3: dynamically consistent null-space posture (acceleration gains,
      # Franka convention) and a one-sided joint-limit spring inside
      # joint_limit_margin of the profile window. The posture reference is the
      # joint configuration latched when Cartesian control starts unless
      # nullspace_posture is given explicitly.
      use_nullspace_posture: true
      kp_null: 10.0
      kd_null: 1.0
      joint_limit_margin: 0.05
      joint_limit_stiffness: [10.0, 10.0, 10.0, 10.0, 3.0, 3.0, 3.0]

  right_task_space_impedance_mit_controller:
    ros__parameters:
      arm: right
      safety_profile_name: mujoco_sim_safe
      safety_profile_file: ''
      ee_frame: openarm_right_hand_tcp
      drive_side_impedance: true
      # Drive-side Cartesian impedance, sized for the SIM model: MuJoCo v1
      # declares no armature, so M_ii is roughly a quarter of the real arm's on
      # the elbow, and the MJCF's own joint damping="0.4" counts toward zeta.
      # kp_i = (kd_i + 0.4)^2 / (4 * 0.7^2) / M_ii,p95, clipped by
      # mujoco_sim_safe's kp_max - which is what binds the wrist at 10.
      kp: [13.0, 10.0, 32.0, 30.0, 10.0, 10.0, 10.0]
      kd: [2.75, 2.50, 2.00, 2.00, 0.70, 0.60, 0.50]
      # The right chain is mirrored in the torso MJCF.  Its symmetric-looking
      # left-arm home is outside the validated startup envelope at the
      # prototype gains and would time out into SAFE.  This is a separately
      # FK-checked, non-singular right-side posture that converges from the
      # MuJoCo initial state without enlarging any safety limit.
      startup_posture: [0.0, -0.15, 0.0, 1.14, 0.0, 0.38, 0.0]
      startup_kp: [35.0, 35.0, 30.0, 25.0, 5.0, 5.0, 5.0]
      startup_kd: [1.75, 1.5, 1.25, 1.25, 0.5, 0.45, 0.4]
      startup_duration: 5.0
      startup_tolerance: 0.05
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]
      kp_task: [150.0, 150.0, 150.0, 8.0, 8.0, 8.0]
      kd_task: [20.0, 20.0, 20.0, 1.2, 1.2, 1.2]
      max_task_wrench: [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]

      # Fix 1: only the model feed-forward (nle) is rate-limited by the profile
      # tau_ff_slew. The Cartesian PD, null-space and joint-limit torques are
      # bounded by max_task_wrench/torque_limit instead, so no rate limiter sits
      # inside the closed loop. Released/canceled references blend to the
      # measured pose over release_duration rather than stepping.
      release_duration: 1.0
      # Fix 2: dq_des = J^+ v_des during an action, so the in-motor kd tracks
      # the commanded motion instead of braking it (zero while idle).
      task_velocity_reference_damping: 0.01
      # Fix 3: dynamically consistent null-space posture (acceleration gains,
      # Franka convention) and a one-sided joint-limit spring inside
      # joint_limit_margin of the profile window. The posture reference is the
      # joint configuration latched when Cartesian control starts unless
      # nullspace_posture is given explicitly.
      use_nullspace_posture: true
      kp_null: 10.0
      kd_null: 1.0
      joint_limit_margin: 0.05
      joint_limit_stiffness: [10.0, 10.0, 10.0, 10.0, 3.0, 3.0, 3.0]

  left_gripper_controller:
    ros__parameters:
      gripper_joint: openarm_left_finger_joint1
      # The MJCF drives the finger through a position servo on the split tendon
      # and reports no finger velocity, so the width rate is differenced from
      # position instead.
      use_velocity_state: false
      use_effort_state: true
      # Both jaws move, so the object sees twice the 44 mm of finger travel.
      joint_at_closed: 0.0
      joint_at_open: 0.044
      width_at_closed: 0.0
      width_at_open: 0.088
      default_speed: 0.05
      max_speed: 0.2
      default_force: 20.0
      max_force: 60.0
      # Simulated contact here is not worth failing a task over: a behaviour
      # tree gets success on a completed motion and reads ~/state for whether
      # anything was actually held.
      report_grasp_failure: false

  right_gripper_controller:
    ros__parameters:
      gripper_joint: openarm_right_finger_joint1
      # The MJCF drives the finger through a position servo on the split tendon
      # and reports no finger velocity, so the width rate is differenced from
      # position instead.
      use_velocity_state: false
      use_effort_state: true
      # Both jaws move, so the object sees twice the 44 mm of finger travel.
      joint_at_closed: 0.0
      joint_at_open: 0.044
      width_at_closed: 0.0
      width_at_open: 0.088
      default_speed: 0.05
      max_speed: 0.2
      default_force: 20.0
      max_force: 60.0
      # Simulated contact here is not worth failing a task over: a behaviour
      # tree gets success on a completed motion and reads ~/state for whether
      # anything was actually held.
      report_grasp_failure: false
