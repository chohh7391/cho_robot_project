/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      ee_state_broadcaster:
        type: cho_controller_openarm_mit/EEStateBroadcaster

      joint_position_mit_controller:
        type: cho_controller_openarm_mit/JointPositionController

      joint_impedance_mit_controller:
        type: cho_controller_openarm_mit/JointImpedanceActionController

      task_space_impedance_mit_controller:
        type: cho_controller_openarm_mit/TaskSpaceImpedanceController

      # Same producer as above with the reference coming from VLA action chunks
      # instead of a TaskSpace goal. Both action spaces are impedance.
      vla_mit_controller:
        type: cho_controller_openarm_mit/VlaController

      # One robot-independent gripper controller per hand. It claims only the
      # finger's position command interface, which no arm controller touches, so
      # it stays active alongside whichever arm controller is switched in.
      gripper_controller:
        type: cho_controller_gripper/GripperController

  joint_state_broadcaster:
    ros__parameters:
      joints: [openarm_joint1, openarm_joint2, openarm_joint3, openarm_joint4,
               openarm_joint5, openarm_joint6, openarm_joint7, openarm_finger_joint1]

  ee_state_broadcaster:
    ros__parameters:
      robot_type: openarm
      base_frame: openarm_link0
      joints: [openarm_joint1, openarm_joint2, openarm_joint3, openarm_joint4,
               openarm_joint5, openarm_joint6, openarm_joint7]
      gripper_joint: openarm_finger_joint1

  joint_position_mit_controller:
    ros__parameters:
      arm: single
      safety_profile_name: mujoco_sim_safe
      # Resolved from cho_description_openarm's installed share directory by launch.
      safety_profile_file: ''
      kp: [70.0, 70.0, 70.0, 60.0, 10.0, 10.0, 10.0]
      kd: [2.75, 2.5, 2.0, 2.0, 0.7, 0.6, 0.5]
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]

  # Direct impedance remains a one-arm producer. The 14-axis paired command
  # path is exclusively BimanualFollowJointTrajectoryController for MoveIt.
  # `torque_limit` caps only the explicit action tau_ff field before the MIT
  # equation; every direct controller uses the upstream OpenArm V1 motor tMax
  # tuple, so this is not a backend-specific torque envelope.
  joint_impedance_mit_controller:
    ros__parameters:
      arm: single
      safety_profile_name: mujoco_sim_safe
      # Resolved from cho_description_openarm's installed share directory by launch.
      safety_profile_file: ''
      kp: [35.0, 35.0, 30.0, 25.0, 5.0, 5.0, 5.0]
      kd: [1.75, 1.5, 1.25, 1.25, 0.5, 0.45, 0.4]
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]

  # Cartesian law matches the Franka controller:
  # tau_ff = J^T(Kx*pose_error + Dx*(twist_des-J*dq)) + nle.
  # During action and Cartesian idle MIT kp/kd are zero. Return-to-zero gains
  # ramp continuously to zero before this mode becomes action-ready.
  task_space_impedance_mit_controller:
    ros__parameters:
      arm: single
      safety_profile_name: mujoco_sim_safe
      safety_profile_file: ''
      ee_frame: openarm_hand_tcp
      drive_side_impedance: true
      # Drive-side Cartesian impedance, sized for the SIM model: MuJoCo v1
      # declares no armature, so M_ii is roughly a quarter of the real arm's on
      # the elbow, and the MJCF's own joint damping="0.4" counts toward zeta.
      # kp_i = (kd_i + 0.4)^2 / (4 * 0.7^2) / M_ii,p95, clipped by
      # mujoco_sim_safe's kp_max - which is what binds the wrist at 10.
      kp: [13.0, 10.0, 32.0, 30.0, 10.0, 10.0, 10.0]
      kd: [2.75, 2.50, 2.00, 2.00, 0.70, 0.60, 0.50]
      startup_posture: [0.0, -0.5, 0.0, 1.2, 0.0, 0.4, 0.0]
      startup_kp: [35.0, 35.0, 30.0, 25.0, 5.0, 5.0, 5.0]
      startup_kd: [1.75, 1.5, 1.25, 1.25, 0.5, 0.45, 0.4]
      startup_duration: 5.0
      startup_tolerance: 0.05
      # Manufacturer peak torque per motor, not the packet's tMax encoding
      # range. The task-space gains below are unchanged.
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]
      kp_task: [150.0, 150.0, 150.0, 8.0, 8.0, 8.0]
      kd_task: [20.0, 20.0, 20.0, 1.2, 1.2, 1.2]
      max_task_wrench: [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]

      # Fix 1: only the model feed-forward (nle) is rate-limited by the profile
      # tau_ff_slew. The Cartesian PD, null-space and joint-limit torques are
      # bounded by max_task_wrench/torque_limit instead, so no rate limiter sits
      # inside the closed loop. Released/canceled references blend to the
      # measured pose over release_duration rather than stepping.
      release_duration: 1.0
      # Fix 2: dq_des = J^+ v_des during an action, so the in-motor kd tracks
      # the commanded motion instead of braking it (zero while idle).
      task_velocity_reference_damping: 0.01
      # Fix 3: dynamically consistent null-space posture (acceleration gains,
      # Franka convention) and a one-sided joint-limit spring inside
      # joint_limit_margin of the profile window. The posture reference is the
      # joint configuration latched when Cartesian control starts unless
      # nullspace_posture is given explicitly.
      use_nullspace_posture: true
      kp_null: 10.0
      kd_null: 1.0
      joint_limit_margin: 0.05
      joint_limit_stiffness: [10.0, 10.0, 10.0, 10.0, 3.0, 3.0, 3.0]

  # VLA reference source over the same drive-side impedance producer. The gains,
  # startup ramp and null-space terms mirror task_space_impedance_mit_controller
  # deliberately: this controller changes only where the reference comes from, so
  # a difference in the law would confound comparing a VLA rollout against a
  # TaskSpace goal on the same arm.
  vla_mit_controller:
    ros__parameters:
      arm: single
      safety_profile_name: mujoco_sim_safe
      safety_profile_file: ''
      ee_frame: openarm_hand_tcp
      drive_side_impedance: true
      kp: [13.0, 10.0, 32.0, 30.0, 10.0, 10.0, 10.0]
      kd: [2.75, 2.50, 2.00, 2.00, 0.70, 0.60, 0.50]
      startup_posture: [0.0, -0.5, 0.0, 1.2, 0.0, 0.4, 0.0]
      startup_kp: [35.0, 35.0, 30.0, 25.0, 5.0, 5.0, 5.0]
      startup_kd: [1.75, 1.5, 1.25, 1.25, 0.5, 0.45, 0.4]
      startup_duration: 5.0
      startup_tolerance: 0.05
      torque_limit: [40.0, 40.0, 27.0, 27.0, 7.0, 7.0, 7.0]
      # Inert under drive_side_impedance (the drive closes the loop with its own
      # kp), but on_configure validates it as 6 POSITIVE values regardless: it is
      # the wrench bound of the legacy tau_ff law and of the equivalent-wrench
      # diagnostic. Mirrors task_space_impedance_mit_controller so the diagnostic
      # readout means the same thing on both controllers.
      max_task_wrench: [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]
      release_duration: 1.0
      task_velocity_reference_damping: 0.01
      use_nullspace_posture: true
      kp_null: 10.0
      kd_null: 1.0
      joint_limit_margin: 0.05
      joint_limit_stiffness: [10.0, 10.0, 10.0, 10.0, 3.0, 3.0, 3.0]

      # REQUIRED on this controller, unlike the TaskSpace one which derives a
      # default. It is the only bound on the impedance torque, because the drive
      # adds kp*(q_des - q) downstream of torque_limit, and the input driving it
      # is untrusted policy output.
      #
      # 0.15 rad (8.6 deg) uniformly, chosen as min(0.25 * torque_limit / kp,
      # 0.15): the torque bound alone would allow 1.5 rad on joint 2, which is
      # not an impedance offset but a lunge. At 0.15 the worst-case impedance
      # torque is kp * 0.15 = [1.95 1.5 4.8 4.5 1.5 1.5 1.5] N*m, 5-18% of each
      # motor's peak, leaving the rest of the budget to gravity.
      max_reference_offset: [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15]

      # 'arrival' places each chunk at the instant it lands. Switch to
      # 'observation' only once the bridge echoes the stamp of the joint state it
      # built its observation from -- a bridge wall clock is a different time
      # domain and would put every waypoint in the wrong epoch.
      chunk_time_source: arrival
      chunk_topic: /vla/action/ee_pose
      # 3x a 15 Hz inference period. A dead policy is caught in 200 ms; a normal
      # gap is not.
      stream_timeout_sec: 0.2
      # Hold that long, then abort the goal. The hold releases the reference to
      # the measured pose over release_duration; it never requests SAFE, which
      # would drop the arm into a fixed-gain hold mid-task.
      hold_timeout_sec: 5.0
      # Cubic blend into a newly spliced chunk, so a chunk that disagrees with
      # the one it replaces does not step the reference.
      # A gap shorter than hold_timeout_sec must not end the rollout: with this
      # off, kHold only leaves via abort, so two consecutive dropped chunks in a
      # 15 Hz BEST_EFFORT stream would kill the goal. Found in MuJoCo, not in the
      # unit tests, which asserted the latching behaviour as designed.
      resume_on_stream_recovery: true
      chunk_blend_duration: 0.1
      # 1.0 = latest chunk wins on overlapping slots. Flow-matching policies are
      # multimodal, so averaging two chunks lands between modes where neither is
      # valid; lower this only for ACT-style checkpoints.
      chunk_aggregate_weight: 1.0
      # 1.0 disables the input low-pass. Observation-time splicing removes the
      # boundary lurch this used to mask; raise it (toward 0.2) only for a policy
      # whose raw output is visibly noisy.
      chunk_ema_factor: 1.0
      # The stream watchdog is the real liveness mechanism; a wall-clock goal
      # budget cannot distinguish a long task from a dead policy.
      goal_timeout_sec: 0.0
      telemetry_period_sec: 0.1
      # Reference-side rate bounds. Joint bounds default to the safety profile's
      # command velocity when unset, which is the authority.
      max_task_lin_vel: 0.25
      max_task_ang_vel: 1.5
      max_task_lin_acc: 1.0
      max_joint_ref_acc: [4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0]
      # This producer owns no finger interface. The hand is driven by
      # cho_controller_gripper, which stays active alongside it.
      enable_gripper: false

  gripper_controller:
    ros__parameters:
      gripper_joint: openarm_finger_joint1
      # The MJCF drives the finger through a position servo on the split tendon
      # and reports no finger velocity, so the width rate is differenced from
      # position instead.
      use_velocity_state: false
      use_effort_state: true
      # Both jaws move, so the object sees twice the 44 mm of finger travel.
      joint_at_closed: 0.0
      joint_at_open: 0.044
      width_at_closed: 0.0
      width_at_open: 0.088
      default_speed: 0.05
      max_speed: 0.2
      default_force: 20.0
      max_force: 60.0
      # Simulated contact here is not worth failing a task over: a behaviour
      # tree gets success on a completed motion and reads ~/state for whether
      # anything was actually held.
      report_grasp_failure: false
