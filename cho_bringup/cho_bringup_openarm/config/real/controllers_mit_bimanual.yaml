      # the measured pose over release_duration rather than stepping.
      release_duration: 1.0
      # Fix 2: dq_des = J^+ v_des during an action, so the in-motor kd tracks
      # the commanded motion instead of braking it (zero while idle).
      task_velocity_reference_damping: 0.01
      # Fix 3: dynamically consistent null-space posture (acceleration gains,
      # Franka convention) plus a one-sided joint-limit spring inside
      # joint_limit_margin of the profile window. Note the return-to-zero
      # target sits 0.001 rad above joint 4's lower limit, so this spring
      # applies a small elbow lift at that idle posture; set the joint 4 entry
      # to 0.0 if that is unwanted.
      use_nullspace_posture: true
      kp_null: 5.0
      kd_null: 0.5
      joint_limit_margin: 0.05
      joint_limit_stiffness: [5.0, 5.0, 5.0, 5.0, 2.0, 2.0, 2.0]
