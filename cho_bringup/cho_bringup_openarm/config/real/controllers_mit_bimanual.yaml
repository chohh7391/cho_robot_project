# Direct real-MIT commissioning configuration for two physically independent
# CAN buses. MoveIt paired ownership is intentionally not enabled for real
# hardware until CAN timing/skew measurements are reviewed.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 200
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      left_ee_state_broadcaster:
        type: cho_controller_openarm/EEStateBroadcaster
      right_ee_state_broadcaster:
        type: cho_controller_openarm/EEStateBroadcaster
      left_joint_impedance_mit_controller:
        type: cho_controller_openarm_mit/JointImpedanceMitActionController
      right_joint_impedance_mit_controller:
        type: cho_controller_openarm_mit/JointImpedanceMitActionController
      left_task_space_impedance_mit_controller:
        type: cho_controller_openarm_mit/TaskSpaceImpedanceMitController
      right_task_space_impedance_mit_controller:
        type: cho_controller_openarm_mit/TaskSpaceImpedanceMitController

  joint_state_broadcaster:
    ros__parameters:
      joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3,
               openarm_left_joint4, openarm_left_joint5, openarm_left_joint6,
               openarm_left_joint7, openarm_right_joint1, openarm_right_joint2,
               openarm_right_joint3, openarm_right_joint4, openarm_right_joint5,
               openarm_right_joint6, openarm_right_joint7]

  left_ee_state_broadcaster:
    ros__parameters:
      robot_type: openarm
      base_frame: openarm_body_link0
      ee_name: openarm_left_hand_tcp
      pose_topic: /ee_state/left/pose
      twist_topic: /ee_state/left/twist
      joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3,
               openarm_left_joint4, openarm_left_joint5, openarm_left_joint6,
               openarm_left_joint7]
      gripper_joint: ''
      gripper_mimic_joints: []

  right_ee_state_broadcaster:
    ros__parameters:
      robot_type: openarm
      base_frame: openarm_body_link0
      ee_name: openarm_right_hand_tcp
      pose_topic: /ee_state/right/pose
      twist_topic: /ee_state/right/twist
      joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3,
               openarm_right_joint4, openarm_right_joint5, openarm_right_joint6,
               openarm_right_joint7]
      gripper_joint: ''
      gripper_mimic_joints: []

  left_joint_impedance_mit_controller:
    ros__parameters:
      arm: left
      safety_backend: real
      safety_profile_name: real_conservative_commissioning
      safety_profile_file: ''
      kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      torque_limit: [0.75, 0.75, 0.45, 0.45, 0.15, 0.15, 0.15]

  right_joint_impedance_mit_controller:
    ros__parameters:
      arm: right
      safety_backend: real
      safety_profile_name: real_conservative_commissioning
      safety_profile_file: ''
      kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      torque_limit: [0.75, 0.75, 0.45, 0.45, 0.15, 0.15, 0.15]

  left_task_space_impedance_mit_controller:
    ros__parameters:
      arm: left
      safety_backend: real
      safety_profile_name: real_conservative_commissioning
      safety_profile_file: ''
      ee_frame: openarm_left_hand_tcp
      kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      startup_posture: [0.0, -0.5, 0.0, 1.2, 0.0, 0.4, 0.0]
      startup_kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      startup_kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      startup_duration: 15.0
      startup_tolerance: 0.05
      torque_limit: [1.0, 1.0, 0.60, 0.60, 0.20, 0.20, 0.20]
      kp_task: [20.0, 20.0, 20.0, 1.0, 1.0, 1.0]
      kd_task: [4.0, 4.0, 4.0, 0.20, 0.20, 0.20]
      max_task_wrench: [8.0, 8.0, 8.0, 1.0, 1.0, 1.0]
      lambda: 0.05
      max_delta_q: 0.00075
      max_goal_translation: 0.05
      max_goal_rotation: 0.35
      max_absolute_radius: 1.20
      max_cartesian_velocity: 0.03
      max_angular_velocity: 0.20

  right_task_space_impedance_mit_controller:
    ros__parameters:
      arm: right
      safety_backend: real
      safety_profile_name: real_conservative_commissioning
      safety_profile_file: ''
      ee_frame: openarm_right_hand_tcp
      kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      startup_posture: [0.0, -0.15, 0.0, 1.14, 0.0, 0.38, 0.0]
      startup_kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      startup_kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      startup_duration: 15.0
      startup_tolerance: 0.05
      torque_limit: [1.0, 1.0, 0.60, 0.60, 0.20, 0.20, 0.20]
      kp_task: [20.0, 20.0, 20.0, 1.0, 1.0, 1.0]
      kd_task: [4.0, 4.0, 4.0, 0.20, 0.20, 0.20]
      max_task_wrench: [8.0, 8.0, 8.0, 1.0, 1.0, 1.0]
      lambda: 0.05
      max_delta_q: 0.00075
      max_goal_translation: 0.05
      max_goal_rotation: 0.35
      max_absolute_radius: 1.20
      max_cartesian_velocity: 0.03
      max_angular_velocity: 0.20
