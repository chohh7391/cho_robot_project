# Real OpenArm MIT commissioning controller map.  This file is selected only
# after the triple runtime opt-in in bringup_real_robot.launch.py.  Values are
# bounded by real_conservative_commissioning and have not been physically
# validated; do not treat them as a production tuning recommendation.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 200
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      ee_state_broadcaster:
        type: cho_controller_openarm/EEStateBroadcaster
      joint_impedance_mit_controller:
        type: cho_controller_openarm_mit/JointImpedanceMitActionController
      task_space_impedance_mit_controller:
        type: cho_controller_openarm_mit/TaskSpaceImpedanceMitController

  joint_state_broadcaster:
    ros__parameters:
      joints: [openarm_joint1, openarm_joint2, openarm_joint3, openarm_joint4,
               openarm_joint5, openarm_joint6, openarm_joint7]

  ee_state_broadcaster:
    ros__parameters:
      robot_type: openarm
      base_frame: openarm_link0
      ee_name: openarm_hand_tcp
      joints: [openarm_joint1, openarm_joint2, openarm_joint3, openarm_joint4,
               openarm_joint5, openarm_joint6, openarm_joint7]
      gripper_joint: ''

  joint_impedance_mit_controller:
    ros__parameters:
      arm: single
      safety_backend: real
      safety_profile_name: real_conservative_commissioning
      safety_profile_file: ''
      kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      torque_limit: [0.75, 0.75, 0.45, 0.45, 0.15, 0.15, 0.15]

  # Task space uses the existing action endpoint but retains an explicit
  # startup posture. It remains inactive unless selected; physical validation
  # of this automatic seed has not been performed.
  task_space_impedance_mit_controller:
    ros__parameters:
      arm: single
      safety_backend: real
      safety_profile_name: real_conservative_commissioning
      safety_profile_file: ''
      ee_frame: openarm_hand_tcp
      kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      startup_posture: [0.0, -0.5, 0.0, 1.2, 0.0, 0.4, 0.0]
      startup_kp: [3.0, 3.0, 3.0, 2.0, 0.5, 0.5, 0.5]
      startup_kd: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.08]
      startup_duration: 15.0
      startup_tolerance: 0.05
      torque_limit: [1.0, 1.0, 0.60, 0.60, 0.20, 0.20, 0.20]
      kp_task: [20.0, 20.0, 20.0, 1.0, 1.0, 1.0]
      kd_task: [4.0, 4.0, 4.0, 0.20, 0.20, 0.20]
      max_task_wrench: [8.0, 8.0, 8.0, 1.0, 1.0, 1.0]
      lambda: 0.05
      max_delta_q: 0.00075
      max_goal_translation: 0.05
      max_goal_rotation: 0.35
      max_absolute_radius: 1.20
      max_cartesian_velocity: 0.03
      max_angular_velocity: 0.20
