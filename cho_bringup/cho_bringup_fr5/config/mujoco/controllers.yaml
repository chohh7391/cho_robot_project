# Controller configuration for the FR5 in MuJoCo, loaded after
# config/common/controllers.yaml (what every backend shares).

controller_manager:
  ros__parameters:
    update_rate: 500

    # Only loaded when the description is expanded with gripper:=ag95; without
    # that the gripper joint does not exist and the spawner is skipped.
    gripper_controller:
      type: cho_controller_gripper/GripperController

gripper_controller:
  ros__parameters:
    gripper_joint: gripper_finger_joint
    # MuJoCo integrates a velocity for the slide joint, so unlike the real 485
    # gripper the rate does not have to be differenced from position. Still no
    # effort: nothing exports one for this joint.
    use_velocity_state: true
    use_effort_state: false
    # Both jaws move, so the object sees twice the 47.5 mm of finger travel.
    joint_at_closed: 0.0
    joint_at_open: 0.0475
    width_at_closed: 0.0
    width_at_open: 0.095
    # command_is_setpoint is deliberately left at its default of false, the
    # opposite of the real bringup: the MuJoCo servo tracks a position stream,
    # so the ramp here IS the speed limit and handing it the target outright
    # would slam the finger across the stroke in one cycle.
    default_speed: 0.05
    max_speed: 0.15
    default_force: 45.0
    max_force: 160.0
    # The finger carries no geom, so it closes on air by construction and a
    # grasp can never succeed. Report motion completion instead of failing
    # every goal.
    report_grasp_failure: false

joint_trajectory_controller:
  ros__parameters:
    # MuJoCo position actuators have a small steady gravity deflection between
    # commanded and measured position.  Seed each new trajectory from the last
    # command so accepting a goal does not first command that deflected state.
    # MoveIt still plans from measured joint state, so keep the simulated
    # command/state deflection small: the short interpolation connector from
    # last command to the first planned point is not in the PlanningScene path.
    # This is intentionally MuJoCo-only; real hardware keeps feedback-based
    # trajectory seeding until it is independently validated.
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      j1: {trajectory: 0.20, goal: 0.05}
      j2: {trajectory: 0.20, goal: 0.05}
      j3: {trajectory: 0.20, goal: 0.05}
      j4: {trajectory: 0.20, goal: 0.05}
      j5: {trajectory: 0.20, goal: 0.05}
      j6: {trajectory: 0.20, goal: 0.05}

task_space_ik_controller:
  ros__parameters:
    bringup_type: mujoco
    max_delta_q: 0.005
