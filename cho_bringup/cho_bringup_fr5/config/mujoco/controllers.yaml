controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_space_position_controller:
      type: cho_controller_fr5/JointSpacePositionController

    task_space_ik_controller:
      type: cho_controller_fr5/TaskSpaceIKController

    # Closes the loop on an RS-232 scale, so it is only useful on a bringup that
    # has one; it is loaded either way and simply never given a goal otherwise.
    pouring_controller:
      type: cho_controller_fr5/PouringController

    # Only loaded when the description is expanded with gripper:=ag95; without
    # that the gripper joint does not exist and the spawner is skipped.
    gripper_controller:
      type: cho_controller_gripper/GripperController

gripper_controller:
  ros__parameters:
    gripper_joint: gripper_finger_joint
    # MuJoCo integrates a velocity for the slide joint, so unlike the real 485
    # gripper the rate does not have to be differenced from position. Still no
    # effort: nothing exports one for this joint.
    use_velocity_state: true
    use_effort_state: false
    # Both jaws move, so the object sees twice the 47.5 mm of finger travel.
    joint_at_closed: 0.0
    joint_at_open: 0.0475
    width_at_closed: 0.0
    width_at_open: 0.095
    # command_is_setpoint is deliberately left at its default of false, the
    # opposite of the real bringup: the MuJoCo servo tracks a position stream,
    # so the ramp here IS the speed limit and handing it the target outright
    # would slam the finger across the stroke in one cycle.
    default_speed: 0.05
    max_speed: 0.15
    default_force: 45.0
    max_force: 160.0
    # The finger carries no geom, so it closes on air by construction and a
    # grasp can never succeed. Report motion completion instead of failing
    # every goal.
    report_grasp_failure: false

joint_trajectory_controller:
  ros__parameters:
    # MuJoCo position actuators have a small steady gravity deflection between
    # commanded and measured position.  Seed each new trajectory from the last
    # command so accepting a goal does not first command that deflected state.
    # MoveIt still plans from measured joint state, so keep the simulated
    # command/state deflection small: the short interpolation connector from
    # last command to the first planned point is not in the PlanningScene path.
    # This is intentionally MuJoCo-only; real hardware keeps feedback-based
    # trajectory seeding until it is independently validated.
    open_loop_control: true
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      j1: {trajectory: 0.20, goal: 0.05}
      j2: {trajectory: 0.20, goal: 0.05}
      j3: {trajectory: 0.20, goal: 0.05}
      j4: {trajectory: 0.20, goal: 0.05}
      j5: {trajectory: 0.20, goal: 0.05}
      j6: {trajectory: 0.20, goal: 0.05}

joint_space_position_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6

task_space_ik_controller:
  ros__parameters:
    robot_type: fr5
    bringup_type: mujoco
    control_mode: position
    ee_name: wrist3_link
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    # lambda damps the DLS near singularities (traded against tracking accuracy);
    # the per-cycle clamp (max_delta_q, now active in the controller) is the hard
    # cap on any residual spike, so lambda can stay small for tight tracking.
    lambda: 0.02
    max_delta_q: 0.005
    # Base-frame workspace plane guard (not full mesh collision checking).
    enforce_workspace_floor: true
    minimum_ee_height: 0.15
    workspace_floor_tolerance: 0.0001
    recovery_minimum_height_gain: 0.01
    recovery_monotonic_tolerance: 0.00001
    recovery_maximum_lateral_displacement: 0.002
    recovery_maximum_orientation_error: 0.01

pouring_controller:
  ros__parameters:
    robot_type: fr5
    bringup_type: mujoco
    control_mode: position
    ee_name: wrist3_link
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    # Where the weight arrives, in grams. A plain Float64 and not the scale
    # driver's own WeightStamped: the controller should not depend on one
    # vendor's message to read a number, and the driver stays the self-contained
    # module cho_sensor/hansung_scale is meant to be. A relay adapts the two.
    scale_topic: /scale/grams
    # Stop tilting if the weight goes quiet for this long. A pour with no
    # feedback is not an adaptive pour, and tilting on the last number heard is
    # how a vessel empties onto the bench.
    scale_timeout: 0.5
    # How long a pour holds still waiting for its FIRST reading. A goal that
    # arrives before the scale node did is a late scale, not a failed one.
    scale_startup_grace: 2.0
    # The law's own sample period. NOT the controller period: the same law runs
    # in simulation at 25 Hz (sdl_project tamp_server), and a pour reported from
    # both has to be one controller sampled the same way. Between law samples the
    # commanded velocity is held, so the command still leaves here at 500 Hz.
    control_period: 0.04
    # PD on the weight error, then convolution shaping. Same gains and the same
    # kernel as the simulated pour; changing one without the other makes the two
    # different controllers wearing one name.
    kp: 0.008
    kd: 0.002
    kernel_horizon: 2.5
    shaping_freq: 0.8
    shaping_decay: 1.2
    kernel_alpha: 0.15
    # Wrist angular velocity ceiling. At the law's 25 Hz this caps one step at
    # 0.02 rad (1.15 deg), which is what keeps the tilt smooth enough not to
    # slosh.
    max_tilt_rate: 0.5
    # Absolute tilt bound from the carried attitude. Well past a normal pour, so
    # it only fires when the scale never reports what the goal asked for.
    max_tilt: 2.0
    # How close to the target counts as poured [g].
    weight_tolerance: 0.5
    # Per-cycle command bound, the same one the task-space controller uses.
    max_delta_q: 0.005
