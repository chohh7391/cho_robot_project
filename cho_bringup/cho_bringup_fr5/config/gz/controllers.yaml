# Controller configuration for the FR5 in Gazebo, loaded after
# config/common/controllers.yaml (what every backend shares). Both reach the
# controller_manager inside Gazebo as the description's <parameters> tags.

controller_manager:
  ros__parameters:
    update_rate: 500

joint_trajectory_controller:
  ros__parameters:
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      j1: {trajectory: 0.20, goal: 0.05}
      j2: {trajectory: 0.20, goal: 0.05}
      j3: {trajectory: 0.20, goal: 0.05}
      j4: {trajectory: 0.20, goal: 0.05}
      j5: {trajectory: 0.20, goal: 0.05}
      j6: {trajectory: 0.20, goal: 0.05}

joint_space_position_controller:
  ros__parameters:
    robot_type: fr5
    bringup_type: gz
    control_mode: position

task_space_ik_controller:
  ros__parameters:
    bringup_type: gz
    max_delta_q: 0.005
