# Controller configuration for the FR5 under Isaac Sim.
#
# Derived from config/mujoco/controllers.yaml. The FR5 runs position-controlled
# drives inside Isaac, so the MuJoCo gains carry over unchanged; only the loop
# rate and the per-cycle slew limit are rescaled for the lower physics rate.

controller_manager:
  ros__parameters:
    # MUST equal the Isaac physics rate (bringup_isaac_robot.launch.py's
    # physics_rate argument): the controller_manager is paced by the /clock
    # Isaac publishes, so a mismatch makes cycles fire in bursts with a zero
    # measured period.
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_space_position_controller:
      type: cho_controller_fr5/JointSpacePositionController

    task_space_ik_controller:
      type: cho_controller_fr5/TaskSpaceIKController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.08
      goal_time: 1.5
      j1: {trajectory: 0.25, goal: 0.08}
      j2: {trajectory: 0.25, goal: 0.08}
      j3: {trajectory: 0.25, goal: 0.08}
      j4: {trajectory: 0.25, goal: 0.08}
      j5: {trajectory: 0.25, goal: 0.08}
      j6: {trajectory: 0.25, goal: 0.08}

joint_space_position_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6

task_space_ik_controller:
  ros__parameters:
    robot_type: fr5
    bringup_type: isaac
    control_mode: position
    ee_name: wrist3_link
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    lambda: 0.02
    # Per cycle, so it scales with update_rate: 0.005 rad/cycle at the MuJoCo
    # 500 Hz is the same joint speed as 0.01 at 250 Hz.
    max_delta_q: 0.01
    # Base-frame workspace plane guard (not full mesh collision checking).
    enforce_workspace_floor: true
    minimum_ee_height: 0.15
    workspace_floor_tolerance: 0.0001
    recovery_minimum_height_gain: 0.01
    recovery_monotonic_tolerance: 0.00001
    recovery_maximum_lateral_displacement: 0.002
    recovery_maximum_orientation_error: 0.01
