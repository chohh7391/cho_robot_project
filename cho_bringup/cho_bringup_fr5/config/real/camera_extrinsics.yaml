# Where each camera sits relative to the FR5, as measured at the bench.
#
# THIS IS THE ONE NUMBER NOTHING ELSE CHECKS. Every object pose the perception
# stack publishes is downstream of it, and a wrong extrinsic produces a
# confident, wrong pose -- there is no gate, no residual and no log line that
# shows it. Re-measure after anything moves, and record what the check said.
#
# It lives HERE, in the cell's bringup, on purpose:
#
#   cho_realsense / cho_oak  are camera drivers. They know nothing about a
#                            robot and publish no transform into one, which is
#                            what lets the same launch serve a bag recording.
#   cho_object_pose          consumes the transform and never names one. It
#                            looks up base_link <- <prefix>tag_<id> and does
#                            not care how that chain was built.
#
# So the only place that knows both a robot and a camera is the bringup for the
# cell they share. Moving the tripod is an edit here and nowhere else.
#
# ------------------------------------------------------------------- frames
#
# `child_frame` is each driver's OWN ROOT, never an optical frame. Both drivers
# publish their internal chain from their own description (`publish_tf: true`
# on the D435; depthai always), so supplying anything below the root would give
# one frame two parents -- not an error, just transforms that resolve through
# whichever arrived last.
#
#   D435   camera_link, named by `camera_name:=` -> `wrist_link` and
#          `side_2_link` here
#   OAK    `side_1_mount`, which cho_oak derives from its `name:=` -- see the
#          note there about the driver's own default being a sentinel
#
# --------------------------------------------------------------- how to redo
#
# `python3 $(ros2 pkg prefix --share cho_camera_calibration)/scripts/solve_hand_eye.py`
# -- see that package's README (its `ros2 run` form finds nothing: the scripts
# install to share/, not lib/). All three entries below come from one run.
#
# THE BOARD'S OWN POSE IS AN OUTPUT, NOT AN INPUT. The earlier procedure put
# one tag at a surveyed point and solved the camera against it, which made
# that tag's residual meaningless (it is fitted) and left the survey itself
# unchecked. Measured: the same board, taped twice at the same nominal spot,
# moved the solved camera 52 mm; and when the robot finally measured where
# the board actually was, it was 48 mm from where it had been placed. Solving
# AX = ZB over a moving arm gives the hand-eye AND the board's pose together,
# so no tape measure enters either number.
transforms:
  # ------------------------------------------------------------------ wrist
  # Eye-in-hand: the D435 rides the wrist, so its transform hangs off
  # `wrist3_link` and the robot's FK carries it. The bringup must therefore be
  # running for any wrist detection to resolve into the base frame.
  #
  # SOLVED from eight arm poses viewing the tag board (2026-09-23), the run
  # that re-placed both standing cameras after they were moved.
  # ALL THREE CAMERAS BELOW COME FROM THAT ONE RUN, which is the point of doing
  # it that way: they are placed against ONE board pose, so a disagreement
  # between them is a real disagreement rather than two different boards.
  #
  # What says this one is right:
  #
  #   reprojection over board corners      0.147-0.346 px across the eight poses
  #   the board's pose, pose to pose       0.53 mm mean, 0.70 mm worst
  #   the board's height                   came out at -0.0113 against a bench
  #                                        at -0.013 -- 1.7 mm, and NOTHING in
  #                                        the solve knows the bench height
  #   the board's plane                    0.35 deg off level
  #   relative rotation between poses      77.4 deg median, 26 of 28 pairs
  #                                        past 30 deg (config/real/handeye_poses.yaml)
  #
  # Nobody touched this camera between 2026-09-22 and this run, and it came out
  # 0.2 mm and 0.97 deg from that evening's solve. It is re-entered anyway: the
  # standing cameras below were placed against the board pose THIS hand-eye
  # produced, and keeping the older wrist value would leave the wrist and them
  # about 9 mm apart at 0.5 m.
  #
  # Every one of those is better than the morning's run on this same bench, and
  # the reason is not the procedure. This camera's firmware was 5.9.2, which
  # ignored every exposure setting and left it about 31% saturated; on 5.17.3.10
  # it takes the configured 3000 us and sits at 2.7%. Saturation costs corner
  # precision first, and corner precision is the whole solve.
  #
  # It came off the bracket for that update and went back on, which moved it
  # about 4 mm -- the difference from the morning's [0.00023, 0.04779, 0.22847].
  # A remount is a re-solve, every time.
  - name: wrist
    parent_frame: wrist3_link
    child_frame: wrist_link
    xyz: [0.00025, 0.04850, 0.23261]
    # x, y, z, w -- the order geometry_msgs uses, NOT the w-first order some
    # CAD tools print.
    quaternion: [0.536962, -0.530907, 0.459547, 0.467576]

  # ----------------------------------------------------------------- side_1
  # Eye-to-hand: the OAK stands beside the bench and does not move, so this is
  # a bench-layout number. IT IS WRONG THE MOMENT THE TRIPOD IS NUDGED -- and
  # it was. The previous entry had it 481 mm from where it actually stands,
  # with no log line, no residual and no symptom beyond object poses that were
  # confidently wrong. Running the board against it put the board 422 mm from
  # its surveyed spot, tilted the bench plane 19.3 degrees off level and spread
  # six coplanar tags over 60 mm of height. A board notices; one tag cannot.
  #
  # SOLVED from the same run as the wrist, off the board pose that run
  # produced:
  #
  #   reprojection over board corners      0.396-0.420 px
  #   camera position across eight views   0.43 mm of spread
  #
  # It saw all six board tags at all eight poses. The previous solve had 5.17 mm
  # of spread because at one pose the ARM STOOD BETWEEN THIS CAMERA AND THE
  # BOARD and it saw three tags instead of six; from where it stands now the
  # same eight poses never block it. If a future position brings that back,
  # re-run with poses chosen to keep the arm out of this camera's line.
  #
  # The camera was moved before this run (2026-09-23), 182 mm and 11.0 deg from
  # the previous entry. Re-run after anything touches it and watch those two
  # numbers -- they are what tells you it has been touched.
  - name: side_1
    parent_frame: base_link
    child_frame: side_1_mount
    xyz: [0.52138, 0.65273, 0.52293]
    quaternion: [0.378580, 0.199000, -0.735016, 0.526144]

  # ----------------------------------------------------------------- side_2
  # The second standing camera:
  #
  #   reprojection over board corners      0.236-0.256 px
  #   camera position across eight views   1.25 mm of spread
  #
  # It saw all six board tags at all eight poses. Moved before this run
  # (2026-09-23), 364 mm and 11.9 deg from the previous entry.
  #
  # Its view is oblique, and that costs pixels in one direction: the board
  # tags' SHORT edge measures 23-32 px from here, against cho_object_pose's
  # 25 px floor. The corners solve fine; a 70 mm vessel tag at the same range
  # and angle will sit on that floor.
  #
  # ITS ANGLE TO side_1 IS THE POINT OF IT. The two stand on opposite sides of
  # the bench and their lines of sight to the board cross at 88.5 degrees, at
  # 0.863 m and 0.928 m -- near-orthogonal, and neither dominating the other by
  # range. Crossing two lines of sight is only worth anything when there is an
  # angle between them: cho_object_pose's `fusion_mode: intersect` stops
  # crossing below `min_ray_angle_deg` and falls back to a weighted mean,
  # saying so in the object's status. 89 degrees is about as good as a bench
  # this size allows, so know what you are giving up before moving either of
  # them -- side by side, the fusion quietly becomes an average again.
  - name: side_2
    parent_frame: base_link
    child_frame: side_2_link
    xyz: [0.85497, -0.57537, 0.51592]
    quaternion: [-0.176785, 0.303620, 0.799049, 0.487938]
