# Real FR5 connection settings. Edit robot_ip to match your controller before
# launching bringup_real_robot.launch.py. The FR5 default is 192.168.58.2.
fr5:
  robot_ip: 192.168.58.2
  tool: 0
  user: 0
  ee_name: wrist3_link
  # none | ag95. The gripper hangs off the robot controller's RS485 end-effector
  # bus rather than off ros2_control, so it is only commandable on this build.
  gripper: ag95
  # RS485 gripper registration, mirroring the teach pendant's own fields.
  #
  # These are only WRITTEN when apply_config is true, and it defaults to false.
  # The pendant's registration is what the controller runs on, so rewriting the
  # end-bus device table on every activation buys nothing, and the readback is
  # no use as confirmation either: GetGripperConfig reported 0/3/0/0 on one run
  # and 1/3/0/0 on the next with nothing written in between. What actually fixed
  # MoveGripper's error 73 was ActGripper, which the driver always calls.
  # Register the gripper from the pendant; turn apply_config on only to
  # (re)apply the values below deliberately.
  #   company     1-Robotiq 2-HITBOT(慧灵) 3-TIANJI(天机) 4-DAHUAN(大寰) 5-ZHIXING(知行)
  #   device      per company; DAHUAN lists only 0-PGI-140, the profile the
  #               AG-95 is driven with
  #   softversion documented as unused by the SDK; the pendant shows D1.0
  #   bus         end-effector port the gripper is plugged into
  #   index       gripper number that ActGripper/MoveGripper address
  gripper_config:
    apply_config: false
    company: 4
    device: 0
    softversion: 0
    bus: 1
    index: 1
    # Percent of the gripper's own range. MoveGripper takes both alongside every
    # target, so they are fixed here rather than per goal; low for commissioning.
    speed_percent: 30
    force_percent: 30
    # Which end of the stroke each percentage means. Verify this the only way
    # that holds up: run `grasp 1` / `grasp 0` from the action client and watch
    # the jaws. Do NOT verify it from the stroke percentage logged at activation
    # - activation moves the jaws itself and re-references the stroke, so that
    # reading contradicts the working values. Getting this backwards inverts
    # both the commands and the width reported on /gripper_controller/state and
    # /joint_states. Swap the two for a gripper wired the other way.
    percent_at_closed: 0
    percent_at_open: 100
    # Open the jaws once on hardware activation, so a bringup always starts from
    # a known opening rather than from wherever the last run stopped.
    #
    # This was false for a long time, and for a real reason: activating this
    # gripper moves the jaws on its own -- a closed one came back open and an
    # open one came back closed -- and the stroke percentage it reported right
    # afterwards could not be squared with what the jaws were doing. Commanding
    # an open on top of that produced a gripper that CLOSED at bringup.
    #
    # That is understood now, and it was never this flag. For roughly 0.8 s after
    # any gripper command the controller's stroke register reports a fixed wrong
    # value; publishing it made cho_controller_gripper seed a closed gripper and
    # command a close nobody asked for. The driver now takes the stroke out of
    # band with GetGripperCurPosition, which is right when the RTDE package is
    # not, and holds it until the package agrees again.
    #
    # Verified both directions on the FR5 (2026-09-16): from closed, activation
    # opened the jaws and both sources then read 100%; from open, the jaws stayed
    # put and the controller issued no command at all.
    open_on_activate: true
    # Whether a gripper that will not come up should take the whole bringup with
    # it. False by default, because a refused hardware activation makes
    # ros2_control_node throw and abort - one 485 hiccup on an accessory would
    # otherwise kill the arm. When it is false and the gripper fails, the arm
    # runs normally, gripper commands are suppressed, and the log says why.
    required: false
  controller_name: joint_space_position_controller
