# FR5 controller parameters that are the same on every backend.
#
# Every bringup loads this file first and config/<backend>/controllers.yaml
# after it; for one parameter name the later file wins. A later file cannot
# remove a key, so a value goes here only when all four backends (real, mujoco,
# isaac, gz) use it unchanged; anything else lives in the backend's file.

controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_space_position_controller:
      type: cho_controller_fr5/JointSpacePositionController

    task_space_ik_controller:
      type: cho_controller_fr5/TaskSpaceIKController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

joint_space_position_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6

task_space_ik_controller:
  ros__parameters:
    robot_type: fr5
    control_mode: position
    ee_name: wrist3_link
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    # lambda damps the DLS near singularities (traded against tracking accuracy);
    # the per-cycle clamp max_delta_q (per backend) is the hard cap on any residual
    # spike, so lambda can stay small for tight tracking.
    lambda: 0.02
    # Base-frame workspace plane guard (not full mesh collision checking).
    enforce_workspace_floor: true
    minimum_ee_height: 0.15
    workspace_floor_tolerance: 0.0001
    recovery_minimum_height_gain: 0.01
    recovery_monotonic_tolerance: 0.00001
    recovery_maximum_lateral_displacement: 0.002
    recovery_maximum_orientation_error: 0.01
