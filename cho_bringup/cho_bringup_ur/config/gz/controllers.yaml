controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_space_position_controller:
      type: cho_controller_ur/JointSpacePositionController

    task_space_ik_controller:
      type: cho_controller_ur/TaskSpaceIKController

    gripper_controller:
      type: cho_controller_gripper/GripperController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

joint_space_position_controller:
  ros__parameters:
    robot_type: ur5e
    bringup_type: gz
    control_mode: position
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

task_space_ik_controller:
  ros__parameters:
    robot_type: ur5e
    bringup_type: gz
    control_mode: position
    ee_name: tool0
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    lambda: 0.02
    max_delta_q: 0.02

gripper_controller:
  ros__parameters:
    # The shared cho_controller_gripper on the Robotiq 2F-85's knuckle joint.
    gripper_joint: robotiq_85_left_knuckle_joint
    use_velocity_state: false   # differenced from position
    use_effort_state: false
    joint_at_closed: 0.7929     # [rad] fully closed
    joint_at_open: 0.0          # [rad] fully open
    width_at_closed: 0.0
    width_at_open: 0.085        # [m] 2F-85 stroke
    # The old UR controller's 0.01 rad on the knuckle, as fingertip width.
    position_tolerance: 0.001
    # Hand gz the target outright, as the UR controller did; a grasp that stalls
    # on an object still ends in success (report_grasp_failure is off).
    command_is_setpoint: true

