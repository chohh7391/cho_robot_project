controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_space_position_controller:
      type: cho_controller_ur/JointSpacePositionController

    task_space_ik_controller:
      type: cho_controller_ur/TaskSpaceIKController

    # Standard FollowJointTrajectory backend (trajectory_replay). Only loaded with
    # load_moveit_controller:=true.
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_space_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

task_space_ik_controller:
  ros__parameters:
    robot_type: ur5e
    bringup_type: mujoco
    control_mode: position
    ee_name: tool0
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    lambda: 0.02
    max_delta_q: 0.02

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    # MuJoCo position actuators have a small steady gravity deflection between
    # commanded and measured position. Seed each new trajectory from the last
    # command so accepting a goal does not first command that deflected state
    # (the same choice as cho_bringup_fr5's MuJoCo joint_trajectory_controller).
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
