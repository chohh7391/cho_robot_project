# cuMotion planning pipeline for MoveIt (todo/CUROBO_MOVEIT_TODO.md Step 3).
#
# Copied from isaac_ros_cumotion_moveit/config/isaac_ros_cumotion_planning.yaml
# (release-3.2). `planning_plugin` is singular and the adapters are the
# `default_planner_request_adapters/*` names, which is the Humble MoveIt 2.5 API
# -- the upstream `main` branch uses the plural Jazzy form and will not load here.
#
# The plugin does not plan. It forwards the MotionPlanRequest, with the whole
# planning scene attached as `planning_scene_diff`, to the `cumotion/move_group`
# action served by isaac_ros_cumotion's Python node, which solves it with cuRobo.
#
# `moveit_configs_utils` finds this file by convention: declaring the pipeline
# `isaac_ros_cumotion` makes it look for `config/isaac_ros_cumotion_planning.yaml`
# in this package.
planning_plugin: isaac_ros_cumotion_moveit/CumotionPlanner
request_adapters: >-
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1
num_steps: 32
