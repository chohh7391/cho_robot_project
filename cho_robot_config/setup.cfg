[develop]
script_dir=$base/lib/cho_robot_config
[install]
install_scripts=$base/lib/cho_robot_config

[tool:pytest]
addopts = -p no:anyio

[flake8]
max-line-length = 120
# The optional flake8 plugins' rules (A builtins, B90 blind-except, C4
# comprehensions, C81 commas, CNL class-newline, D docstrings, I import-order,
# Q quotes) are pinned off, as in cho_task_manager: this code is written to
# pycodestyle + pyflakes only.
extend-ignore = A,B90,C4,C81,CNL,D,I,Q
per-file-ignores =
    __init__.py:F401
