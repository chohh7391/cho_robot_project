schema_version: 1
robot_type: ur5e
model:
  base_frame: world
  arm_base_link: base_link
  ee_link: tool0
  joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
controllers:
  hold: joint_space_position_controller
  # Position only: every UR bringup hard-codes control_mode 'position'
  # (cho_bringup_ur/launch/*.launch.py), so there is no velocity or torque
  # hold controller to declare. Asking for one raises rather than silently
  # falling back to a controller the bringup never loaded.
  hold_by_control_mode:
    position: joint_space_position_controller
  direct_joint: joint_space_position_controller
  direct_task: task_space_ik_controller
  moveit_trajectory: joint_trajectory_controller
  gripper: gripper_controller
  vla: null
moveit:
  config_package: cho_moveit_ur
  planning_group: ur_manipulator
  execution:
    max_velocity_scaling_factor: 0.25
    max_acceleration_scaling_factor: 0.25
actions:
  # Action names follow cho_interfaces/CONTRACT.md: /<node>/<kind>, served by
  # the controller (or the MoveIt bridge) under its own node. The first joint
  # and task entries are this profile's MoveIt bridge, whose node name is
  # registry.moveit_bridge_node(); validate_robot_config() checks both.
  preferences:
    joint: [/ur5e_moveit_action_bridge/joint_space, /joint_space_position_controller/joint_space]
    task: [/ur5e_moveit_action_bridge/task_space, /task_space_ik_controller/task_space]
    gripper: []
  gripper_command:
    topic: /robotiq_controller/commands
    open: 0.0
    close: 0.7929
poses:
  home:
    '0': [0.0, -1.57, 0.0, -1.57, 0.0, 0.0]
    '1': [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
    '2': [0.2, -1.4, 1.4, -1.6, -1.5, 0.2]
    '3': [-0.2, -1.4, 1.4, -1.6, -1.5, -0.2]
  # Where the behaviour-tree tasks start and finish a mission
  # (cho_robot_config.task_home_pose): the ready pose, home 1.
  task_home: '1'
motions:
  reach:
    '0': {relative: false, position: [0.2, -0.2, 0.5], orientation: [1.0, 0.0, 0.0, 0.0]}
    '1': {relative: false, position: [0.2, 0.2, 0.6], orientation: [1.0, 0.0, 0.0, 0.0]}
    '2': {relative: true, position: [0.0, 0.0, -0.2], orientation: [0.0, 0.0, 0.0, 1.0]}
    '3': {relative: false, position: [0.6, 0.0, 0.1], orientation: [1.0, 0.0, 0.0, 0.0]}
